<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- An internal control plane holding customer data has no business in a
         search index, and there is nothing here to share. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- The board colour behind the browser chrome, so the fore edge does not
         end at a white strip on a phone. -->
    <meta name="theme-color" content="#efe9d9" />

    <!-- The three faces are self-hosted, never fetched from a font CDN: this
         origin holds the session that opens every stored OAuth credential and
         should make no third-party request at all. Only the latin subsets are
         preloaded; the latin-ext and Vietnamese ones are fetched on demand by
         unicode-range, so a reader who needs them pays for them and nobody
         else does. -->
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/garamond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- The device: an inked block with the undercroft's arch cut through it.
         The SVG is the mark itself and flips its two inks on the reader's colour
         scheme, so it stays legible in a light tab strip and a dark one; the PNG
         is there for the browsers that still ignore an SVG icon, and can only be
         the light cut. The touch icon is full-bleed and square because iOS masks
         the corners itself. See src/components/Mark.tsx. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Undercroft</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
