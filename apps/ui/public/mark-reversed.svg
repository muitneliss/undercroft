<!--
  The device reversed, for grounds too dark to cut ink into: the same block and
  the same cutting as `mark.svg`, inked in board stock instead. Kept as a file
  rather than solved with a media query because the readers that need it most
  (GitHub's dark theme, a slide deck) pick the asset themselves and never run
  the query.
-->
