# Ymir harness profile — audited interview decisions.
# Machine-readable half of the spec; the LLM-facing half is harness-playbook.md.
# Generated by the Ymir interview. No harness files were written by the interview.

meta:
  project: vietcham-data-ops
  generated_by: ymir
  generated_at: 2026-09-17
  spec_version: 2

project:
  language: python
  runtime: cpython-3.12
  layer: backend
  host: github
  notes: >-
    Data platform, not a published package. Gate is `make verify` (ruff check +
    ruff format --check + pytest). Test venv is .venv-tests, built from
    requirements-dev.txt resolved as a set. Deployment is Dokploy raw-compose.

target_agent:
  value: any
  why: >-
    AGENTS.md is a deliberate symlink to CLAUDE.md so Claude Code and Codex read
    identical rules and cannot drift. Both agents work this repo, so the harness
    must be agent-neutral in what it *enforces*.
  findings: "any — CLAUDE.md present (4.9K) with AGENTS.md -> CLAUDE.md symlink; no .claude/ directory"

  # DELIBERATE DEVIATION FROM YMIR'S STOCK `any` MODE — user-approved.
  #
  # Stock `any` writes a single AGENT.md with all rules embedded inline and no
  # .claude/ at all. Applied here it would replace a design this repo already
  # chose and documented: the CLAUDE.md + AGENTS.md symlink. Rather than fight
  # it, the harness keeps the symlink and splits enforcement out:
  deviation:
    steering_file: CLAUDE.md            # NOT AGENT.md; AGENTS.md symlink preserved
    rules_location: .claude/rules/      # path-scoped; Claude auto-loads, Codex ignores
    rules_discoverability: >-
      Because Codex does not auto-discover .claude/rules/, CLAUDE.md carries an
      explicit rules index. This is the one place a pointer is required; under
      stock claude-code mode it would be redundant.
    wiki_guard: ci                      # no PreToolUse hook — Codex would bypass it

concerns:

  rules:
    status: captured
    why: >-
      The conventions are already written and still get violated at specific
      paths — float creeping into an amount, a mock standing in for a real
      in-memory implementation, a real client name in a tracked fixture.
      CLAUDE.md states them always-on, which means they are loudest when
      irrelevant and no louder than usual at the moment of the edit. Path-scoped
      rules fire when a matching file is opened, which is when the rule bites.
    findings: >-
      present-strong — CLAUDE.md encodes three headline rules plus money/tests/
      deployment sections; docs/adr/ holds 3 accepted ADRs; module docstrings in
      vcdo/core/money.py, vcdo/core/names.py and vcdo/lake/store.py explain the
      reasoning unusually well. But no .claude/rules/, no .editorconfig: nothing
      is path-scoped, so nothing fires at edit time.
    alternatives_considered:
      - keep-everything-in-CLAUDE.md
      - docs/rules.md
      - split-for-context-economy-instead-of-enforcement
    files:

      - name: data-integrity
        paths:
          - "vcdo/**/*.py"
          - "migrations/**/*.sql"
        obey:
          - Decimal end to end; NUMERIC(18,4) in Postgres
          - amounts carry their currency; conversion is an explicit step through a dated rate
          - comparison is three-valued — ok / mismatch / unverified
          - an unreadable value returns None and the caller records why
          - an unresolved identity is "" — visibly missing beats invisibly false
        avoid:
          - float for any monetary amount
          - defaulting an unreadable amount to 0
          - a best-guess identity code
          - implicit currency conversion
          - treating "no evidence" as "pass"

      - name: raw-lake
        paths:
          - "vcdo/lake/**/*.py"
          - "vcdo/sources/**/*.py"
        obey:
          - raw is the only durable layer; it cannot be recomputed
          - writes are create-only
          - re-storing identical bytes writes nothing and reports unchanged
          - retention is bounded and names what it removed
        avoid:
          - overwriting an existing object in place
          - pruning silently
          - treating a curated table as durable

      - name: tests
        paths:
          - "tests/**/*.py"
        obey:
          - use tmp_path; anything under test takes an explicit output destination
          - prefer a real in-memory implementation over a mock
          - a guard needs two tests — one proving it fires, one proving it stays quiet
          - every module a test imports is pinned in requirements-dev.txt
          - report an interval, not a bare percentage
        avoid:
          - writing into the repo
          - asserting that a mock was called
          - installing a test dependency by hand without pinning it
          - reading coverage as correctness

      - name: pii
        paths:
          - "tests/**"
          - "fixtures/**"
          - "docs/**"
          - "wiki/**"   # added at apply time per the wiki section: PII binds wiki/ as it binds docs/
          - "*.md"
        obey:
          - tracked files use CASE-IDs
          - real names live only in restricted storage and in conversation with the owner
        avoid:
          - a client name in any tracked file
          - committing .dokploy.json or any token file
          - committing anything under data/ or fixtures/live/

      - name: deployment
        paths:
          - "deploy/**"
          - "flows/**"
        obey:
          - the Dokploy API is the only channel for changes
          - SSH is read-only, for diagnosis
          - every service carries an explicit memory limit — shared host, eleven other tenants
          - deploy/compose/ in this repo is the source of truth; Dokploy holds a copy
          - fetch settings.getOpenApiDocument and search it before naming an endpoint
        avoid:
          - editing anything directly on the server
          - inventing a Dokploy endpoint name
          - adding a service with no memory limit
        # flows/ is currently empty. The glob is deliberate and forward-looking:
        # the rule should be live the moment the first Kestra flow lands, not
        # retrofitted afterwards.

  lint:
    status: captured
    tool: ruff
    config: pyproject.toml
    strict: false
    style:
      line_length: 110
      formatter: ruff-format
      isort_known_first_party: [vcdo]
      select: [E, F, I, UP, B, SIM]
    why: >-
      ruff needs no change — it is conservative on purpose and every ignore
      carries a written reason. The real gap is pyright: configured in
      pyproject.toml (standard mode, pointed at .venv-tests) but neither pinned
      in requirements-dev.txt nor run by make verify, so the config is
      aspirational. Pin it and measure the true error count before gating,
      because pyproject's own comment is right — a wall of false errors trains
      people to ignore the real ones.
    findings: >-
      present-strong — ruff select E,F,I,UP,B,SIM with reasoned ignores
      (E731, B905, SIM300), line-length 110, isort first-party vcdo;
      `make lint` runs ruff check + ruff format --check. Weakness:
      [tool.pyright] exists but pyright is absent from requirements-dev.txt and
      from every make target.
    alternatives_considered:
      - gate-pyright-immediately
      - keep-pyright-editor-only-and-document-it
      - widen-ruff-select-to-RUF-PL-ANN-PTH-S
    type_checker:
      tool: pyright
      pin: true            # add to requirements-dev.txt, re-resolved as a set
      gate: false          # NOT in make verify yet — decision deferred to the measurement
      measured_by: ci      # continuous, non-blocking, so the number is always visible

  ci:
    status: captured
    provider: github-actions
    workflow: .github/workflows/ci.yml
    triggers: [push-to-main, pull-request]
    runs:
      - make-verify           # blocking: ruff check + ruff format --check + gate tests
      - pyright               # non-blocking (continue-on-error) — this is the measurement
      - wiki-check            # blocking: wiki check --error-on-untracked-sources
    excludes:
      - tests/monitors        # binds to live data; red means drift, not a defect
      - tests/integration     # needs the docker stack and secrets
    why: >-
      make verify is the gate but nothing enforces it — it holds only when
      someone remembers. The Makefile already anticipates CI: its comment on
      `itest` says the plain `test` target deliberately does not source .env
      "or CI cannot run it", so the gate was built to run on a machine with no
      stack and no secrets. CI is simply collecting on that design.
    findings: "missing — GitHub remote (muitneliss/vietcham-data-ops) but no .github/ at all"
    alternatives_considered:
      - make-verify-only
      - lint-only
      - skip-ci
    release:
      tool: release-please
      release_type: python
      workflow: .github/workflows/release-please.yml
      bumps: "[project].version in pyproject.toml"
      changelog: CHANGELOG.md
      publishes: false       # nothing is published; no PyPI target
      deploys: false         # a tag must never touch production on its own
      why: >-
        Gives a versioned marker to deploy AT, which the repo currently lacks —
        "which build is on the server" is unanswerable today. Deployment stays
        manual through the dokploy skill, keeping the rule that the API is the
        only channel for changes under a human hand, and keeping a production
        credential off GitHub and away from a shared host.
      prerequisite: >-
        Conventional Commits. History is not conventional (e.g. "Phase 1:
        HubSpot vertical slice…"). release-please rewrites nothing — it simply
        sees nothing to release until commits read feat: / fix:. Handled by the
        conventional-commits steer in claude_md; NOT enforced by a commitlint
        job, which would be a gate on a single operator.
      alternatives_considered:
        - release-please-plus-dokploy-deploy-on-tag
        - changelog-only-no-version-bump
        - manual-make-release-target

  wiki:
    status: captured
    enabled: true
    collection: vietcham-data-ops-wiki
    guard: ci-blocking       # target_agent is `any`; a PreToolUse hook would not bind Codex
    boundary:
      docs: "DECISIONS we made — numbered, dated, immutable, superseded rather than edited"
      wiki: "FACTS we learned — measured, updatable, keyword-searchable"
      rule: >-
        An ADR may cite a wiki page for the measurement behind it. A wiki page
        never records a decision. The PII rule binds wiki/ exactly as it binds
        docs/ — CASE-IDs only.
    why: >-
      One body of knowledge lives in no file in this repo: the expensive
      findings from the legacy system — the raw-lake deduplication ratio, the
      instability of Gmail attachment ids, the Xero credit-note payment quirk,
      the volatile-key identity failure that repointed 178 of 358 mappings at
      the wrong company. Today they are referenced in prose and readable only by
      opening another repo on disk. The ownership boundary is what stops this
      becoming a second, drifting docs/.
    findings: >-
      present-weak — docs/ is strong human documentation (README index, 3 ADRs,
      contracts/ and runbook/ planned) but there is no keyword-searchable agent
      context store, and no distillation of the legacy reference at
      /Users/cuong/Desktop/repo/vcc-ostwin-architecture-review.
    alternatives_considered:
      - skip-docs-is-the-single-home
      - scaffold-now-decide-the-boundary-later

  claude_md:
    status: captured
    file: CLAUDE.md
    symlink: AGENTS.md       # preserve; never replace with a copy
    shrink: true
    steer:
      - point-to-rules-index     # required here: Codex does not auto-discover .claude/rules/
      - point-to-wiki-boundary   # docs/ = decisions, wiki/ = learned facts
      - verify-before-commit     # make verify is the gate
      - conventional-commits     # without this, release-please never sees a release
    keeps:
      - what this is
      - the three headline rules, as one-liners
      - the legacy-repo reference and how to treat it
      - the ingestion shape (no ingestion platform; dlt is a library)
      - the ADR convention
    moves_to_rules:
      - money/Decimal specifics -> .claude/rules/data-integrity.md
      - test discipline -> .claude/rules/tests.md
      - deployment channel rules -> .claude/rules/deployment.md
      - PII specifics -> .claude/rules/pii.md
    why: >-
      Once the rules live in .claude/rules/, keeping full copies in CLAUDE.md
      gives every rule two owners — and the next edit updates one of them. That
      is precisely the drift the AGENTS.md symlink was built to prevent, so the
      same instinct is applied one level down: one owner per rule. CLAUDE.md
      keeps what only it can say and becomes the map, not the territory.
    findings: >-
      present-strong — CLAUDE.md 4.9K, well-reasoned, with AGENTS.md symlink and
      a note explaining why the symlink exists rather than two synced copies.
    alternatives_considered:
      - keep-CLAUDE.md-complete-and-let-rules-restate-it
      - minimal-edit-append-pointers-only

# --- Consistency audit (Step 2) ----------------------------------------------
audit:
  checked:
    - "target_agent <-> .claude/ presence: `any` with no .claude/ found — consistent; the .claude/rules/ deviation is user-approved and recorded above."
    - "target_agent <-> wiki: `any` means no PreToolUse hook; substituted a blocking CI wiki check. Confirmed with the user."
    - "ci.provider <-> project.host: github-actions matches github. OK."
    - "lint.strict <-> project.layer/runtime: conservative ruff is sound for a Python backend whose ignores are individually justified. OK."
    - "rules.paths <-> layout: vcdo/, migrations/, tests/, fixtures/, docs/, deploy/ all exist."
  flagged:
    - concern: rules
      issue: "flows/ is an empty directory, so the deployment rule's second glob matches nothing today."
      resolution: "Kept deliberately — planned Kestra flow directory, not a typo. The rule should be live when the first flow lands."
    - concern: lint
      issue: >-
        ruff cannot enforce most captured rules. "Never guess", create-only lake
        writes and "the Dokploy API is the only channel" are architectural; the
        rule files are their only enforcement.
      resolution: >-
        Accepted and recorded. A green `make verify` is not evidence that these
        held — which is itself an instance of rule 2: no evidence is not a pass.
