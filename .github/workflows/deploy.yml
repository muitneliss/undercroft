# Roll the current release out to Dokploy through its API, then prove it landed.
#
# There is deliberately NO `push:` trigger. Images are published only on a release, so a
# push to main changes no image; deploying on one would restart the whole stack to roll out
# the release that is already running. This runs from release.yml after the images are
# built, or by hand.
#
# Every step is `task cd:<cmd>` -- the same command an operator runs by hand, wrapping
# `bun run scripts/dokploy.ts <cmd>`. The Dokploy API is the only channel for a change; SSH
# is for reading state, never making one. See .claude/rules/tooling.md.
name: deploy

on:
  workflow_call:
    inputs:
      tag:
        description: "The release being rolled out, e.g. v1.2.3. The panel decides which images to pull; this is the tag `verify` proves the running digest against."
        required: true
        type: string
    secrets:
      dokploy_api_key:
        required: true
      dokploy_compose_id:
        required: true
      # Optional so a fork without a Lark group can still deploy; the `notify` job then
      # fails on its own, visibly, and the rollout's result is untouched.
      lark_webhook_url:
        required: false
      lark_webhook_secret:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Which images get pulled is the panel's to decide via IMAGE_TAG; this is the tag `verify` proves the running digest against. Leave as latest unless rolling out a specific release."
        default: "latest"
        type: string

# One compose, one deploy at a time, and cancel-in-progress MUST stay false: Dokploy has no
# API to cancel a running deploy (compose.cancelDeployment is cloud-only), so cancelling
# this job would not stop the rollout -- it would abandon it half-applied with nothing
# watching and no log collected.
concurrency:
  group: dokploy-deploy
  cancel-in-progress: false

env:
  # Public knowledge, not a secret: a wrong endpoint belongs in a diff, not hidden in
  # repository settings. Only the api key and the compose id are secret.
  DOKPLOY_API_ENDPOINT: https://lowbit.link/api

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read # `verify` reads ghcr manifests to compare digests
    # Every step the `notify` job can name as the one that stopped the rollout. Evaluated
    # when the job ends, failed or not.
    outputs:
      steps: ${{ toJSON(steps) }}
    env:
      DOKPLOY_API_KEY: ${{ secrets.dokploy_api_key || secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.dokploy_compose_id || secrets.DOKPLOY_COMPOSE_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require the secrets this job cannot derive
        id: secrets
        run: |
          missing=0
          [ -z "$DOKPLOY_API_KEY" ]   && { echo "::error::secret DOKPLOY_API_KEY is not set";   missing=1; }
          [ -z "$DOKPLOY_COMPOSE_ID" ] && { echo "::error::secret DOKPLOY_COMPOSE_ID is not set"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "rolling out ${{ inputs.tag }}"

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: go-task/setup-task@v2

      - run: bun install --frozen-lockfile

      # The gate before anything is queued, when failing is free: the panel must point at
      # published images and be told to pull them.
      - name: Preflight
        id: preflight
        run: task cd:preflight

      - name: Deploy and wait for it to settle
        id: deploy
        run: task cd:deploy TAG=${{ inputs.tag }}

      # BEFORE the smoke probes: Dokploy reports `done` for a deploy that changed nothing,
      # and every probe passes against the old images. This asks the host which image digest
      # each released container is actually running and compares it to what ghcr serves.
      #
      # The tag is passed so the ghcr side is the immutable `vX.Y.Z` manifest. The host pulls
      # `latest` (the panel's IMAGE_TAG), and comparing `latest` to itself would prove only
      # that a moving pointer equals itself.
      - name: Verify the host runs the published images
        id: verify
        run: task cd:verify TAG=${{ inputs.tag }}

      - name: Smoke-test the public surface
        id: smoke
        run: task cd:smoke URL=https://undercroft.lowbit.link/api/health

      # Otherwise the only record of why a rollout failed lives in a panel the reader may not
      # have access to, and Dokploy prunes it.
      - name: Collect the deployment log
        if: failure()
        run: task cd:logs

  # Its own job, not a last step: a step cannot run when the job failed before checkout, and
  # the deploy job should never hold the Lark webhook it has no use for. A notice that fails
  # to post turns THIS job red and leaves the deploy's own result as it was.
  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      LARK_WEBHOOK_URL: ${{ secrets.lark_webhook_url || secrets.LARK_WEBHOOK_URL }}
      LARK_WEBHOOK_SECRET: ${{ secrets.lark_webhook_secret || secrets.LARK_WEBHOOK_SECRET }}
      DEPLOY_TAG: ${{ inputs.tag }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      DEPLOY_STEPS: ${{ needs.deploy.outputs.steps }}
      DEPLOY_SITE: https://undercroft.lowbit.link
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: go-task/setup-task@v2
      # No `bun install`: scripts/notify.ts imports only Node built-ins.
      - run: task notify:deploy
