# Version, changelog, tag -- and then, on a release, build the images and deploy them.
#
# release-please maintains a release PR from Conventional Commits. Merging it bumps
# `version` in package.json, writes CHANGELOG.md, and cuts a GitHub release + tag. Only THEN
# do the images build and the stack roll over; a plain push to main ships nothing.
#
# This reverses the pre-rebrand stance that shipping stays a manual act. The trade is
# recorded in docs/adr/0008: a full-privilege Dokploy key now lives in GitHub secrets,
# accepted because the alternative (a deploy webhook) returns no deployment id, so nothing
# could poll, verify, or collect a log -- and an unverified deploy is how a release reports
# success while the host runs the build before it.
#
# release-please reads `release-please-config.json` and `.release-please-manifest.json` rather
# than inputs here, because the release now carries two files the `node` strategy alone would
# not bump: the CLI skill's pinned version (`skills/undercroft/references/cli.md`) and the CLI
# package's (`apps/cli/package.json`) -- `extra-files`. The one package is still the root, and
# `include-component-in-tag: false` keeps tags `vX.Y.Z`, so `tag_name` feeds the image and
# deploy jobs below exactly as before. ADR 0044.
name: release

on:
  push:
    branches: [main]

# Nothing here runs on the workflow's own GITHUB_TOKEN: release-please acts as the App
# below, and the two called workflows each grant themselves what they need. An unused
# write-capable token is a credential nobody is watching.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please MUST NOT author the release PR as the default GITHUB_TOKEN. Since
      # June 2026 GitHub parks any workflow run on a PR that `github-actions[bot]` opened
      # behind "requires approval from a maintainer" -- on a same-repo branch, not just a
      # fork -- so the release PR sat with no CI until someone clicked. Approving it by hand
      # every release is how a release eventually gets merged on a stale green.
      #
      # An installation token is a different identity, so the gate does not apply. It is an
      # App rather than a PAT because a PAT belongs to a person: it expires, and it makes
      # every release read as authored by whoever happened to mint it. The App is named by its
      # client id: v3 of the action deprecates `app-id`.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attach the CLI to the release: `undercroft-cli-X.Y.Z.tgz`, the file the skill's pinned URL
  # installs, and the same bytes as `undercroft-cli.tgz`, which the README's
  # `releases/latest/download` URL installs (ADR 0046). A GitHub release asset rather than an
  # npm package, so the tag that deploys a server is the one place its matching CLI is
  # published from. Its own job, needing only the release: it neither waits for the images nor
  # holds up the deploy.
  release-cli:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The engines floor of the packed CLI (`@oclif/core` 5), and what `npm pack` runs on.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
      - run: task build:cli-pack
      - run: task cd:cli-upload TAG=${{ needs.release-please.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the release's images. Gated on a release actually being cut, and granting
  # packages:write on THIS job -- a called workflow can only narrow the caller's token.
  release-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      tags: ${{ needs.release-please.outputs.tag_name }},latest

  # `needs` names BOTH jobs on purpose. release-please alone satisfies the graph and would
  # start the deploy while the build is still running, so `latest` would resolve to the
  # PREVIOUS release and the deploy would report success on the wrong images.
  deploy:
    needs: [release-please, release-images]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      dokploy_api_key: ${{ secrets.DOKPLOY_API_KEY }}
      dokploy_compose_id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
      lark_webhook_url: ${{ secrets.LARK_WEBHOOK_URL }}
      lark_webhook_secret: ${{ secrets.LARK_WEBHOOK_SECRET }}

  # A release that broke before its deploy started says so; the deploy reports itself, from
  # deploy.yml, so `deploy` is deliberately NOT in `needs` -- listing it would post a failed
  # rollout twice. `failure()` here is true only when one of the jobs named below failed.
  notify:
    needs: [release-please, release-cli, release-images]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
      LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: go-task/setup-task@v2
      - run: task notify:release
