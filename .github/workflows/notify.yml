# Post issues, pull requests and a red `ci` on main to the team's Lark group.
#
# Deploys and failed releases post from deploy.yml and release.yml, where their result is
# known; this workflow covers what happens to the repository between releases.
#
# `pull_request_target`, not `pull_request`: a fork's PR gets no secrets under the latter, so
# its notice could never post. The price of the target variant is that it runs with this
# repository's secrets, which is safe ONLY because nothing here runs the PR's code -- the
# checkout below is the default branch, and the PR reaches the script as the event payload,
# which is data it renders as plain text. Never add a checkout of the PR's head to this file.
name: notify

on:
  issues:
    types: [opened, reopened, closed]
  pull_request_target:
    types: [opened, reopened, closed]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  lark:
    # workflow_run: only a failure, and only of a push -- `branches: [main]` matches a fork's
    # PR whose head branch happens to be called main as well.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
      LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: go-task/setup-task@v2
      # No `bun install`: scripts/notify.ts imports only Node built-ins.
      - run: task notify:event
