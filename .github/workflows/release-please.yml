# Version + CHANGELOG + tag. Nothing else.
#
# WHY THIS EXISTS: "which build is on the server" is currently unanswerable.
# This produces a versioned marker to deploy AT -- it does not deploy.
#
# WHAT IT DOES NOT DO, BY DECISION:
#   * No deploy step. A merged release PR must not become a production change.
#     Shipping stays a human action through the `dokploy` skill, which keeps the
#     "the API is the only channel" rule under a human hand and keeps a
#     production credential for a shared host off GitHub.
#   * No publish step. Nothing here goes to PyPI.
#
# PREREQUISITE -- Conventional Commits. This repo's history is not conventional
# ("Phase 1: HubSpot vertical slice...", "Drop Airbyte: ..."). release-please
# rewrites nothing; it simply finds nothing to release until commit subjects
# read feat: / fix: / etc. There is deliberately no commitlint job: a gate on
# commit messages in a single-operator repo costs more than the feedback of a
# release PR that never appears.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR. Merging it bumps [project].version in
      # pyproject.toml, writes CHANGELOG.md, and cuts a GitHub release + tag.
      #
      # Note: this runs with the default GITHUB_TOKEN, so the release PR it
      # opens will NOT trigger the CI workflow (GitHub suppresses workflow runs
      # for events raised by GITHUB_TOKEN, to prevent loops). The release PR
      # contains only a version bump and a changelog, so that is acceptable --
      # but if this workflow ever gains steps that change code, swap in a PAT or
      # a GitHub App token so the PR gets gated like any other.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
