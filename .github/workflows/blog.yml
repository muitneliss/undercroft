# The blog (apps/blog) is static files on Cloudflare Pages at blog.undercroft.lowbit.link (ADR 0145).
#
# A pull request that touches the blog gets the build as its check; a merge to main publishes,
# through `task cd:blog` -- the command a person runs for a manual publish.
# Unlike release.yml, a plain push ships here, because a post changes no running code and
# should not wait for an unrelated release. docs/adr/0089 records the trade.
#
# The build is `task build:blog`, the same command a developer runs, so the check here and a
# local run share one definition of green (.claude/rules/tooling.md).
name: blog

on:
  push:
    branches: [main]
    paths:
      - "apps/blog/**"
      - "apps/ui/public/**"
      - ".github/workflows/blog.yml"
      - "bun.lock"
  pull_request:
    paths:
      - "apps/blog/**"
      - "apps/ui/public/**"
      - ".github/workflows/blog.yml"
      - "bun.lock"
  workflow_dispatch:

permissions: {}

# One publish at a time, and a newer merge supersedes one still queued -- but never cancel a
# deploy halfway, which can leave Pages serving a partial site.
concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
      - run: task build:blog

  # cd:blog builds before it uploads, so main needs no separate build job.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: blog
      url: https://blog.undercroft.lowbit.link
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
      - run: task cd:blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
