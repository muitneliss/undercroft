name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # One definition of the gate: the same `bun run verify` a developer runs locally.
      - run: bun run verify

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every service must declare a memory limit. A service with no ceiling can starve
      # the others on a small host. This reads compose's own resolved JSON, so a missing
      # parser cannot look like a passing check.
      - name: every service declares a memory limit
        run: |
          cd deploy/compose
          cp .env.example .env
          missing=$(docker compose config --format json \
            | python3 -c 'import json,sys; c=json.load(sys.stdin); \
              print("\n".join(n for n,s in c["services"].items() \
              if not s.get("deploy",{}).get("resources",{}).get("limits",{}).get("memory")))')
          if [ -n "$missing" ]; then echo "services with no memory limit:"; echo "$missing"; exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor of the PII rule: secret-bearing paths stay untracked. Catches the two
      # ways it breaks by accident; the rule itself covers the ways it breaks by reasoning.
      - name: secret-bearing paths are not tracked
        run: |
          for path in deploy/compose/.env .env; do
            if git ls-files --error-unmatch "$path" 2>/dev/null; then
              echo "$path is tracked and must not be"; exit 1
            fi
          done
