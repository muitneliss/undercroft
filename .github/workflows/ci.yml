# The gate, enforced.
#
# `make verify` was already built to run here: the plain `test` target
# deliberately does not source .env, because the gate must pass on a machine
# with no stack and no secrets. This workflow collects on that design.
#
# CI calls `make`, never `ruff`/`pytest` directly. Two spellings of "the gate"
# drift, and then a green check here stops meaning what a green run locally
# means.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned deliberately. A floating "latest" would let an upstream release
  # change what the wiki guard means without a commit in this repo.
  YMIR_VERSION: "0.8.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Builds .venv-tests from requirements-dev.txt as a SET (one pip install,
      # never package by package -- see the note in that file), installs the
      # package, then runs ruff check + ruff format --check + the gate tests.
      #
      # tests/monitors/ and tests/integration/ stay out. Monitors bind to live
      # data and deployed services, so red there means data drift, not a code
      # defect; integration needs the docker stack and secrets. Do not add them
      # here to "get them running in CI" -- that teaches people to ignore red.
      - name: make verify
        run: make verify

      # Measurement, not a gate.
      #
      # [tool.pyright] in pyproject.toml points at .venv-tests, which the step
      # above just built. This runs non-blocking on purpose: nobody has measured
      # how many of these errors are real, and gating on an unmeasured wall of
      # them trains people to ignore the wall. Promote to blocking once the
      # count is known and small.
      - name: pyright (non-blocking measurement)
        continue-on-error: true
        run: .venv-tests/bin/pyright

      # Wiki guard.
      #
      # This harness targets Claude Code *and* Codex, so there is no PreToolUse
      # hook -- a hook binds one agent and half-enforcement reads as enforcement.
      # This is the agent-independent equivalent: a wiki page asserting a fact
      # whose source is not tracked fails the build rather than quietly becoming
      # folklore.
      #
      # Downloaded into a temp dir and checksum-verified against the published
      # SHA256SUMS before it is allowed to run.
      - name: Install Ymir wiki CLI
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          base="https://github.com/muitneliss/ymir/releases/download/ymir-v${YMIR_VERSION}"
          curl -fsSL -o "$tmp/wiki-linux-x64" "$base/wiki-linux-x64"
          curl -fsSL -o "$tmp/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          (cd "$tmp" && grep ' wiki-linux-x64$' SHA256SUMS.txt | sha256sum -c -)
          chmod +x "$tmp/wiki-linux-x64"
          sudo mv "$tmp/wiki-linux-x64" /usr/local/bin/wiki

      - name: wiki check
        run: wiki --root ./wiki check --error-on-untracked-sources
