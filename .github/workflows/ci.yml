# The runner image is pinned rather than `ubuntu-latest` in every workflow here: that label
# migrates to Ubuntu 26 in October 2026, and a base image that changes under a release build
# is a variable nobody chose. Bump the pin deliberately, in one commit, across all four files.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # `apps/cli/src/cli.test.ts` runs the built CLI under `node`, as its users do, and the
      # packed CLI promises Node 22 (`@oclif/core` 5's floor). Pinned to that floor rather than
      # left to whatever the runner image ships, so the gate tests the promise.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
      # One definition of the gate: the same `task ci:verify` a developer runs locally --
      # itself a thin wrapper over `bun run verify`. See .claude/rules/tooling.md.
      - run: task ci:verify

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
      # The package, not just the bundle: pack the tarball a release attaches and run it
      # through `npx --package=<tgz>`, which is exactly how the skill runs it.
      - name: the packed CLI runs through npx
        run: task ci:cli-pack-check
      # Needs the network (it fetches the `skills` CLI), which is why it is not in ci:verify.
      - name: npx skills finds every published skill
        run: task ci:skill-check

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      # Every service must declare a memory limit. A service with no ceiling can starve
      # the others on a small host. This reads compose's own resolved JSON, so a missing
      # parser cannot look like a passing check.
      #
      # BOTH files: the development one and the server variant that Dokploy actually runs.
      # A limit that exists here but not in the deployed file is a limit that does not exist.
      - name: every service declares a memory limit
        run: task ci:compose-check

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      # The floor of the PII rule: secret-bearing paths stay untracked. Catches the two
      # ways it breaks by accident; the rule itself covers the ways it breaks by reasoning.
      - name: secret-bearing paths are not tracked
        run: task ci:secrets-check
