name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push should cancel the first run rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The gate must pass with NO credentials, NO docker and NO network access
      # to any source. Integration tests skip cleanly when the stack is absent,
      # which is exactly the situation here -- and that skip behaviour is itself
      # worth exercising on every push.
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q

  types:
    name: types (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reports, never blocks. Nobody has measured how many of these findings are
    # real, and a wall of false errors trains people to ignore the true ones.
    # Promote to required once that count is known and small.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - run: pyright

  compose:
    name: compose definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Validates the stack definition without starting it. Catches a malformed
      # compose file or an unsubstituted variable before it reaches the server,
      # where the same mistake is a failed deploy on a host shared with other
      # projects.
      - name: Validate docker compose
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose config -q
          echo "services:"
          docker compose config --services

      # Every service must declare a memory limit. The target host has no swap,
      # so an unlimited container turns a spike into an OOM kill that takes
      # something else down with it.
      - name: Every service has a memory limit
        working-directory: deploy/compose
        run: |
          docker compose config --format json | python3 -c "
          import sys, json
          cfg = json.load(sys.stdin)
          missing = [n for n, s in cfg['services'].items()
                     if not s.get('deploy', {}).get('resources', {}).get('limits', {}).get('memory')]
          for n in missing:
              print(f'::error::service {n} has no memory limit')
          sys.exit(1 if missing else 0)
          "

  secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # A narrow, honest check: the files we know carry secrets must be ignored,
      # and no tracked file may contain a real-looking key. This is not a
      # substitute for a scanning tool -- it is the floor.
      - name: Secret-bearing files are gitignored
        run: |
          for f in .dokploy.json deploy/compose/.env; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "::error::$f is tracked and must not be"
              exit 1
            fi
          done
          echo "secret-bearing paths are untracked"

      - name: No private keys or tokens in tracked content
        run: |
          if git grep -nIE -- '-----BEGIN (RSA|OPENSSH|PRIVATE)|gh[pousr]_[A-Za-z0-9]{30,}|pat-[a-z]{2}[0-9]-' -- . ':!docs/data-platform-handoff.md'; then
            echo "::error::possible credential in tracked content"
            exit 1
          fi
          echo "no credential-shaped strings found"
