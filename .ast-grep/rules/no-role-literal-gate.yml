---
# The browser never computes what a role may do (ADR 0139). `BUILT_IN_GRANTS` lives in
# `@undercroft/contracts/access` so that the server's policy and the fixtures standing in for
# the server's answer are one table -- `apps/ui/src/test/**` and the suites read it for that --
# and a screen that read it would hold a copy of the policy that is wrong for every role a
# customer defines. A screen reads `permissions` off `tenants.get`, through `can()`.
id: no-role-policy-in-ui-ts
language: typescript
severity: error
message: >-
  The browser reads what a reader may do from the server's `permissions`, through can();
  it never computes it from BUILT_IN_GRANTS. See .claude/rules/access.md (ADR 0139).
files:
  - "apps/ui/src/**"
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "apps/ui/src/test/**"
rule:
  kind: identifier
  regex: "^BUILT_IN_GRANTS$"
---
