# Bans React's `useState` in the UI. Client state belongs in the Zustand store
# (apps/ui/src/store.ts); server state belongs in the tRPC React Query hooks
# (trpc.*.useQuery()). A local `useState` is a third, unowned source of truth.
#
# Two rules because ast-grep binds one language per rule: `.tsx` parses as `tsx`,
# `.ts` as `typescript`. Both are scoped to apps/ui -- `useState` is a React concern,
# and the backend apps have no React. See .claude/rules/state.md and docs/adr/0009.
#
# `apps/ui/src/components/ui/**` is exempt in both rules below: shadcn's CLI copies
# component source there verbatim, and some of that vendored wrapper code calls
# `useState` internally for its own open/pressed/focus bookkeeping -- not application
# state, and not ours to rewrite on every `shadcn add`. It never touches the Zustand
# store. See docs/adr/0025.
id: no-usestate-tsx
language: tsx
severity: error
message: >-
  useState is banned in the UI. Put client state in the Zustand store
  (apps/ui/src/store.ts) and server state in tRPC React Query hooks
  (trpc.*.useQuery()). See .claude/rules/state.md.
files:
  - "apps/ui/**"
ignores:
  - "apps/ui/src/components/ui/**"
rule:
  any:
    - pattern: useState($$$ARGS)
    - pattern: React.useState($$$ARGS)
---
# Same exemption, same reason -- see no-usestate-tsx above.
id: no-usestate-ts
language: typescript
severity: error
message: >-
  useState is banned in the UI. Put client state in the Zustand store
  (apps/ui/src/store.ts) and server state in tRPC React Query hooks
  (trpc.*.useQuery()). See .claude/rules/state.md.
files:
  - "apps/ui/**"
ignores:
  - "apps/ui/src/components/ui/**"
rule:
  any:
    - pattern: useState($$$ARGS)
    - pattern: React.useState($$$ARGS)
