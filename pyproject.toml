[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vietcham-data-ops"
version = "0.1.0"
description = "VietCham data platform: HubSpot/Xero/Gmail/Drive -> raw lake -> curated SQL -> BI"
requires-python = ">=3.12"
dependencies = [
    "dlt[filesystem]>=1.29",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.9",
    "zstandard>=0.23",
]

[project.scripts]
vcdo = "vcdo.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["vcdo"]

# --- ruff --------------------------------------------------------------------
# Conservative on purpose. A rule that breaks the codebase en masse gets disabled
# with a reason rather than triggering a 70-file refactor.
[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["fixtures/live", "deploy", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # Assigning a lambda is occasionally the clearest way to express a rule table.
    "E731",
    # `zip(strict=)` is good practice but we gate it per-call where lengths are
    # genuinely known to differ; a blanket rule produced false positives.
    "B905",
    # SIM300 rewrites `assert SCALE == Decimal("0.0001")` into
    # `assert Decimal("0.0001") == SCALE`. In an assertion the subject under test
    # belongs on the left, so the "fix" reads backwards. The rule is aimed at
    # `if 5 == x`, which is not a shape this codebase writes.
    "SIM300",
]

[tool.ruff.lint.isort]
known-first-party = ["vcdo"]

# --- pyright -----------------------------------------------------------------
# Point the type checker at the same venv the tests use. Without this it resolves
# against the system interpreter, reports every third-party import as missing,
# and the resulting wall of false errors trains people to ignore the real ones.
[tool.pyright]
venvPath = "."
venv = ".venv-tests"
include = ["vcdo", "tests"]
typeCheckingMode = "standard"

# --- pytest ------------------------------------------------------------------
# The gate/monitor split matters. `norecursedirs` is used rather than
# `addopts = --ignore` or `-m "not monitor"`, because those beat even an explicit
# path argument and would make `pytest tests/monitors/` silently collect nothing.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["monitors", "fixtures", ".venv*", "__pycache__", ".kanna", "data"]
addopts = "-ra --strict-markers"
markers = [
    "monitor: binds to live data or a deployed service; red means data drift, not a code defect, and does not block the gate",
    "integration: needs the local docker compose stack (make up)",
]
