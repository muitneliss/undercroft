# Generic, DSN-parameterised database operations -- used directly when
# UNDERCROFT_POSTGRES_DSN is already set in the environment (e.g. against a remote/staging
# database). For the local compose Postgres, use the dev:migrate / dev:invite wrappers
# instead, which point at localhost for you.
version: "3"

tasks:
  migrate:
    desc: Apply the schema to whatever UNDERCROFT_POSTGRES_DSN points at.
    cmds:
      - bun run migrate

  search-index:
    # One pass of the `search-index` service (packages/db/src/searchIndexCli.ts): build the BM25
    # indexes that are missing, rebuild the invalid, reindex the grown. As the bootstrap role, like
    # migrate -- building on raw.document_text needs the table's owner. ADR 0155, ADR 0156.
    desc: Build, mend and measure every tenant's BM25 search indexes in whatever UNDERCROFT_POSTGRES_DSN points at (the bootstrap role), once.
    cmds:
      - bun run search-index

  invite:
    desc: "Invite a user. Usage: UNDERCROFT_POSTGRES_DSN=... task db:invite -- you@x.test --tenant CASE-0001 --role admin [--create-tenant]"
    cmds:
      - bun run invite -- {{.CLI_ARGS}}

  extract-accuracy:
    # Here rather than in ci:* because it answers with a percentage and has no build-failing
    # side. The part that CAN be asserted rides `bun test` from
    # apps/worker/src/services/extract/accuracy.test.ts and is already inside ci:verify; this
    # is the run that produces the numbers. It is in db:* because the corpus tiers read
    # UNDERCROFT_POSTGRES_DSN -- with none set it still scores the authored gold set against
    # the shipped readers and reports the rest as unmeasured rather than as zero.
    desc: >-
      Measure extraction accuracy and write the report to data/ (gitignored).
      Tier A needs nothing; the corpus tiers use UNDERCROFT_POSTGRES_DSN, and the OOXML oracle
      additionally needs UNDERCROFT_S3_BUCKET_RAW and its credentials.
    cmds:
      - bun run extract:accuracy

  semantic-probe:
    # A measurement like extract-accuracy, for the same reason it is not in ci:*: it answers
    # with numbers, and it needs a database and a provider key the offline gate must not have.
    # It SENDS one tenant's document text to TypeSafe, so it takes the tenant explicitly and
    # never defaults one. apps/worker/src/semanticProbeCli.ts says what it measures and why.
    desc: >-
      Ask Jev about a sample of one tenant's document text and write the cost and answers to
      data/ (gitignored). Needs UNDERCROFT_POSTGRES_DSN and UNDERCROFT_TYPESAFE_API_KEY.
      Usage: task db:semantic-probe -- --tenant CASE-0042 [--part files|bodies|all] [--limit 200] [--multi 50] [--max-chars 32000]
    cmds:
      - bun run semantic:probe -- {{.CLI_ARGS}}

  lake-compact:
    # Deletes from the raw lake, so a dry run unless `--apply` is passed, and each stream's plan
    # is written to the lake's `_reports/lake-compaction/` before anything is removed. It needs
    # the object store as well as the database, which is why it reads the worker's own S3
    # variables beside the DSN. docs/runbook/deployment.md, "Compacting the lake"; ADR 0160.
    desc: >-
      Remove the lake observations that repeat the one before them under a spec's
      unorderedArrays, reporting every one. Dry run unless --apply. Needs
      UNDERCROFT_POSTGRES_DSN, UNDERCROFT_S3_BUCKET_RAW and its endpoint and keys.
      Usage: task db:lake-compact -- [--tenant CASE-0042] [--apply] [--concurrency 16]
    cmds:
      - bun run lake:compact -- {{.CLI_ARGS}}

  document-purge:
    # Deletes the only copy we hold of a customer's files once they have been read (the owner's
    # decision, ADR 0161), so a dry run unless `--apply` is passed. It backfills each document's
    # name and link first, reports what is still unread and why, and purges only what every
    # holder in every tenant has settled. Same tunnel and variables as lake-compact.
    # docs/runbook/deployment.md, "Purging document bytes".
    desc: >-
      Backfill raw.documents' file name and source link, report the documents still unread, and
      purge from the lake the document bytes extraction has finished with, recording each one.
      Dry run unless --apply. Needs UNDERCROFT_POSTGRES_DSN, UNDERCROFT_S3_BUCKET_RAW and its
      endpoint and keys. Usage: task db:document-purge -- [--tenant CASE-0042] [--apply] [--concurrency 16]
    cmds:
      - bun run document:purge -- {{.CLI_ARGS}}
