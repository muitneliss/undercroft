# Generic, DSN-parameterised database operations -- used directly when
# UNDERCROFT_POSTGRES_DSN is already set in the environment (e.g. against a remote/staging
# database). For the local compose Postgres, use the dev:migrate / dev:invite wrappers
# instead, which point at localhost for you.
version: "3"

tasks:
  migrate:
    desc: Apply the schema to whatever UNDERCROFT_POSTGRES_DSN points at.
    cmds:
      - bun run migrate

  invite:
    desc: "Invite a user. Usage: UNDERCROFT_POSTGRES_DSN=... task db:invite -- you@x.test --tenant CASE-0001 --role admin [--create-tenant]"
    cmds:
      - bun run invite -- {{.CLI_ARGS}}

  extract-accuracy:
    # Here rather than in ci:* because it answers with a percentage and has no build-failing
    # side. The part that CAN be asserted rides `bun test` from
    # apps/worker/src/services/extract/accuracy.test.ts and is already inside ci:verify; this
    # is the run that produces the numbers. It is in db:* because the corpus tiers read
    # UNDERCROFT_POSTGRES_DSN -- with none set it still scores the authored gold set against
    # the shipped readers and reports the rest as unmeasured rather than as zero.
    desc: >-
      Measure extraction accuracy and write the report to data/ (gitignored).
      Tier A needs nothing; the corpus tiers use UNDERCROFT_POSTGRES_DSN, and the OOXML oracle
      additionally needs UNDERCROFT_S3_BUCKET_RAW and its credentials.
    cmds:
      - bun run extract:accuracy

  semantic-probe:
    # A measurement like extract-accuracy, for the same reason it is not in ci:*: it answers
    # with numbers, and it needs a database and a provider key the offline gate must not have.
    # It SENDS one tenant's document text to TypeSafe, so it takes the tenant explicitly and
    # never defaults one. apps/worker/src/semanticProbeCli.ts says what it measures and why.
    desc: >-
      Ask Jev about a sample of one tenant's document text and write the cost and answers to
      data/ (gitignored). Needs UNDERCROFT_POSTGRES_DSN and UNDERCROFT_TYPESAFE_API_KEY.
      Usage: task db:semantic-probe -- --tenant CASE-0042 [--part files|bodies|all] [--limit 200] [--multi 50] [--max-chars 32000]
    cmds:
      - bun run semantic:probe -- {{.CLI_ARGS}}
