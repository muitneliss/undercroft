# Producing artifacts: the SPA bundle, generated assets/schemas, and local Docker images.
version: "3"

tasks:
  ui:
    desc: Build the SPA bundle (vite build). Also the build:ui step of the gate.
    cmds:
      - bun run build:ui

  blog:
    desc: Check and build the static blog (apps/blog) into apps/blog/dist -- what GitHub Pages serves.
    cmds:
      - bun run build:blog

  cli:
    desc: Build the CLI into apps/cli/dist/undercroft.mjs -- one Node ES module, the router's manifest baked in.
    cmds:
      - bun run build:cli

  cli-pack:
    desc: Build the CLI and pack it as apps/cli/dist/undercroft-cli-X.Y.Z.tgz, the file each release attaches.
    cmds:
      - bun run build:cli-pack

  installer-cli:
    desc: >-
      Compile the setup wizard for linux-x64/arm64, darwin-arm64/x64 and windows-x64 into
      apps/installer-cli/dist/, with undercroft-installer-SHA256SUMS. Needs the network (Bun
      fetches each target's runtime). ADR 0095.
    cmds:
      - bun run build:installer-cli

  desktop:
    desc: >-
      Build the desktop app (apps/desktop, Electrobun) for THIS operating system into
      apps/desktop/artifacts/: a .dmg on macOS, a Setup .zip on Windows, a .tar.gz on Linux, and
      the updater's files. Needs the network the first time (Hutch fetches the pinned toolchain).
      ADR 0097.
    cmds:
      - bun run build:desktop

  desktop-icons:
    desc: >-
      Render the desktop app's icons (the .iconset, the Windows/Linux PNG, the tray images) from
      apps/desktop/assets/icon.svg and apps/ui/public/mark.svg. macOS only (uses sips); the PNGs
      are committed.
    cmds:
      - bun run build:desktop-icons

  spec-schema:
    desc: Emit the connector spec's JSON Schema to specs/schema/connector.v1.json.
    cmds:
      - bun run spec:schema

  geo:
    desc: Regenerate the UI's static geo assets (world + Vietnam provinces topology).
    cmds:
      - bun run geo:build

  worker-image:
    desc: Build the worker's Docker image locally, for testing the Dockerfile (tag undercroft-worker:local).
    cmds:
      - docker build -f {{.ROOT_DIR}}/deploy/Dockerfile.worker -t undercroft-worker:local {{.ROOT_DIR}}

  control-plane-image:
    desc: Build the control plane's Docker image locally (tag undercroft-control-plane:local).
    cmds:
      - docker build -f {{.ROOT_DIR}}/deploy/Dockerfile.control-plane -t undercroft-control-plane:local {{.ROOT_DIR}}

  images:
    desc: Build both first-party Docker images locally. CI publishes the real ones via build-images.yml.
    deps: [worker-image, control-plane-image]
