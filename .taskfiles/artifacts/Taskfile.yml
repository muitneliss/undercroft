# Producing artifacts: the SPA bundle, generated assets/schemas, and local Docker images.
version: "3"

vars:
  POSTGRES_DOCKERFILE: "{{.ROOT_DIR}}/deploy/Dockerfile.postgres"
  # The Postgres image's tag, `<PG_MAJOR>-pgts<PG_TEXTSEARCH_VERSION>`, read from the
  # Dockerfile's own ARGs so the recipe and its name cannot disagree. This is the one place the
  # tag is derived; the local build and the publish below both use it. An ARG that cannot be
  # read fails the task rather than producing a tag with a hole in it. ADR 0155.
  POSTGRES_IMAGE_TAG:
    sh: |
      major="$(sed -n 's/^ARG PG_MAJOR=//p' "{{.POSTGRES_DOCKERFILE}}")"
      pgts="$(sed -n 's/^ARG PG_TEXTSEARCH_VERSION=//p' "{{.POSTGRES_DOCKERFILE}}")"
      if [ -z "$major" ] || [ -z "$pgts" ]; then
        echo "cannot read ARG PG_MAJOR / PG_TEXTSEARCH_VERSION from {{.POSTGRES_DOCKERFILE}}" >&2
        exit 1
      fi
      echo "${major}-pgts${pgts}"
  # OWNER defaults to the namespace the compose files name; the workflow passes the repository
  # owner, so a fork publishes under its own, as build-images.yml does.
  POSTGRES_IMAGE: 'ghcr.io/{{.OWNER | default "muitneliss"}}/undercroft-postgres:{{.POSTGRES_IMAGE_TAG}}'

tasks:
  ui:
    desc: Build the SPA bundle (vite build). Also the build:ui step of the gate.
    cmds:
      - bun run build:ui

  blog:
    desc: Check and build the static blog (apps/blog) into apps/blog/dist -- what Cloudflare Pages serves.
    cmds:
      - bun run build:blog

  cli:
    desc: Build the CLI into apps/cli/dist/undercroft.mjs -- one Node ES module, the router's manifest baked in.
    cmds:
      - bun run build:cli

  cli-pack:
    desc: Build the CLI and pack it as apps/cli/dist/undercroft-cli-X.Y.Z.tgz, the file each release attaches.
    cmds:
      - bun run build:cli-pack

  installer-cli:
    desc: >-
      Compile the setup wizard for linux-x64/arm64, darwin-arm64/x64 and windows-x64 into
      apps/installer-cli/dist/, with undercroft-installer-SHA256SUMS. Needs the network (Bun
      fetches each target's runtime). ADR 0095.
    cmds:
      - bun run build:installer-cli

  desktop:
    desc: >-
      Build the desktop app (apps/desktop, Electrobun) for THIS operating system into
      apps/desktop/artifacts/: a .dmg on macOS, a Setup .zip on Windows, a .tar.gz on Linux, and
      the updater's files. Needs the network the first time (Hutch fetches the pinned toolchain).
      ADR 0098.
    cmds:
      - bun run build:desktop

  desktop-icons:
    desc: >-
      Render the desktop app's icons (the .iconset, the Windows/Linux PNG, the tray images) from
      apps/desktop/assets/icon.svg and apps/ui/public/mark.svg. macOS only (uses sips); the PNGs
      are committed.
    cmds:
      - bun run build:desktop-icons

  spec-schema:
    desc: Emit the connector spec's JSON Schema to specs/schema/connector.v1.json.
    cmds:
      - bun run spec:schema

  geo:
    desc: Regenerate the UI's static geo assets (world + Vietnam provinces topology).
    cmds:
      - bun run geo:build

  village-assets:
    desc: >-
      Rebuild the Journal village's models (apps/ui/src/assets/village/) from the free KayKit
      Adventurers, Character Animations and Medieval Hexagon packs, unzipped under KAYKIT_DIR
      (outside the repo). Usage: task build:village-assets KAYKIT_DIR=~/kaykit. ADR 0116.
    requires:
      vars: [KAYKIT_DIR]
    env:
      KAYKIT_DIR: "{{.KAYKIT_DIR}}"
    cmds:
      - bun run village:assets
      # atlas.json is written as one line; the formatter lays it out as the gate expects. The
      # leading colon names the root's ci:format: without it Task looks for build:ci:format.
      - task: :ci:format

  worker-image:
    desc: Build the worker's Docker image locally, for testing the Dockerfile (tag undercroft-worker:local).
    cmds:
      - docker build -f {{.ROOT_DIR}}/deploy/Dockerfile.worker -t undercroft-worker:local {{.ROOT_DIR}}

  control-plane-image:
    desc: Build the control plane's Docker image locally (tag undercroft-control-plane:local).
    cmds:
      - docker build -f {{.ROOT_DIR}}/deploy/Dockerfile.control-plane -t undercroft-control-plane:local {{.ROOT_DIR}}

  images:
    desc: Build both first-party Docker images locally. CI publishes the real ones via build-images.yml.
    deps: [worker-image, control-plane-image]

  # Not in `images`: those two are built per release, this one per recipe, and compiling the
  # extension is minutes a release-image check should not pay.
  postgres-image:
    desc: >-
      Build the Postgres image (postgres:17-alpine + pg_textsearch, deploy/Dockerfile.postgres) for
      this machine, tagged with the content-pinned ref it is published under. ADR 0155.
    cmds:
      # No build context: the image takes nothing from the repository but its Dockerfile, and
      # an empty context keeps deploy/compose/.env out of the daemon.
      - docker build -t "{{.POSTGRES_IMAGE}}" - < "{{.POSTGRES_DOCKERFILE}}"
      - echo "built {{.POSTGRES_IMAGE}}"

  postgres-image-publish:
    desc: >-
      Build the Postgres image for linux/amd64 and linux/arm64 and push it, unless its tag already
      exists -- the tag is immutable. Needs buildx, QEMU and a ghcr.io login; run by
      .github/workflows/postgres-image.yml. OWNER=<namespace> overrides muitneliss.
    cmds:
      # Three outcomes, never guessed between: the tag exists (skip), the registry says it is not
      # found (build), anything else -- a refused login, a network failure -- fails, because
      # treating "could not ask" as "absent" would overwrite a tag a server may be running.
      - |
        if out="$(docker buildx imagetools inspect "{{.POSTGRES_IMAGE}}" 2>&1)"; then
          echo "{{.POSTGRES_IMAGE}} already exists; not overwriting it. A recipe change must change PG_MAJOR or PG_TEXTSEARCH_VERSION in deploy/Dockerfile.postgres."
          exit 0
        fi
        case "$out" in
          *": not found"*) ;;
          *) echo "cannot tell whether {{.POSTGRES_IMAGE}} exists:" >&2; echo "$out" >&2; exit 1 ;;
        esac
        docker buildx build --platform linux/amd64,linux/arm64 --push \
          -t "{{.POSTGRES_IMAGE}}" - < "{{.POSTGRES_DOCKERFILE}}"
        echo "pushed {{.POSTGRES_IMAGE}}"
