# scripts/dokploy.ts, one task per subcommand -- CI runs these, and an operator runs the
# same commands by hand for a manual deploy or a rollback. The Dokploy API is the only
# channel for a change; see .claude/rules/deployment.md and docs/runbook/deployment.md.
# `cli-upload`, `installer-upload` and `desktop-release` are the three deliveries that are not a
# deploy: each attaches files to a release.
#
# Credentials (DOKPLOY_API_ENDPOINT/API_KEY/COMPOSE_ID) come from the ambient environment,
# exactly as they do for `bun run scripts/dokploy.ts` today -- Task does not manage them.
version: "3"

tasks:
  preflight:
    desc: Assert the Dokploy panel points at published images with the right compose flags.
    cmds:
      - bun run scripts/dokploy.ts preflight

  deploy:
    desc: "Trigger a deploy and wait for it to settle. Usage: task cd:deploy TAG=v1.2.3"
    requires:
      vars: [TAG]
    cmds:
      - bun run scripts/dokploy.ts deploy {{.TAG}}

  verify:
    desc: "Prove the host runs the published images for TAG. Usage: task cd:verify TAG=v1.2.3"
    requires:
      vars: [TAG]
    cmds:
      - bun run scripts/dokploy.ts verify {{.TAG}}

  smoke:
    desc: Smoke-test a public URL (defaults to the production health endpoint).
    vars:
      URL: '{{.URL | default "https://undercroft.lowbit.link/api/health"}}'
    cmds:
      - bun run scripts/dokploy.ts smoke {{.URL}}

  logs:
    desc: Print the most recent Dokploy deployment's log.
    cmds:
      - bun run scripts/dokploy.ts logs

  status:
    desc: Print the compose stack's status and its most recent deployment.
    cmds:
      - bun run scripts/dokploy.ts status

  cli-upload:
    desc: >-
      Attach the packed CLI to the GitHub release TAG (after task build:cli-pack), under its
      versioned name and as undercroft-cli.tgz. Usage: task cd:cli-upload TAG=v1.2.3 -- needs
      GH_TOKEN. The versioned file is what the skill pins; the plain one is what the README's
      releases/latest/download URL installs.
    requires:
      vars: [TAG]
    vars:
      VERSIONED: apps/cli/dist/undercroft-cli-{{trimPrefix "v" .TAG}}.tgz
      LATEST: apps/cli/dist/undercroft-cli.tgz
    cmds:
      # Delivery, but not to Dokploy: a release asset is how the CLI is published (ADR 0044).
      # The file is named from the tag rather than globbed, so a stale tarball in dist/ from
      # another version can never be the one attached. --clobber makes a re-run replace it.
      # The unversioned copy is the same bytes: GitHub resolves releases/latest/download/<name>
      # only for a name every release shares, which a versioned name never is (ADR 0046).
      - cp {{.VERSIONED}} {{.LATEST}}
      - gh release upload {{.TAG}} {{.VERSIONED}} {{.LATEST}} --clobber

  installer-upload:
    desc: >-
      Attach the compiled setup wizard and its checksums to the GitHub release TAG (after task
      build:installer-cli). Usage: task cd:installer-upload TAG=v1.2.3 -- needs GH_TOKEN.
    requires:
      vars: [TAG]
    cmds:
      # Every file is named without a version, so `releases/latest/download/<name>` finds the
      # newest one and `releases/download/<tag>/<name>` pins one (ADR 0046, ADR 0095). They are
      # listed rather than globbed, so a stray file in dist/ is never published. --clobber makes
      # a re-run replace them.
      - >-
        gh release upload {{.TAG}} --clobber
        apps/installer-cli/dist/undercroft-installer-linux-x64
        apps/installer-cli/dist/undercroft-installer-linux-arm64
        apps/installer-cli/dist/undercroft-installer-darwin-arm64
        apps/installer-cli/dist/undercroft-installer-darwin-x64
        apps/installer-cli/dist/undercroft-installer-windows-x64.exe
        apps/installer-cli/dist/undercroft-installer-SHA256SUMS
        deploy/install/install.sh

  desktop-release:
    desc: >-
      Checksum the desktop app's artifacts gathered under DIR into undercroft-desktop-SHA256SUMS
      and attach both to the GitHub release TAG. Usage: task cd:desktop-release DIR=... TAG=v1.2.3
      -- needs GH_TOKEN. ADR 0098.
    requires:
      vars: [DIR, TAG]
    cmds:
      # The script lists what it attaches by Electrobun's own naming pattern rather than by a
      # glob, for the reason installer-upload lists its files: a stray file is never published.
      - bun run desktop:release {{.DIR}} --upload {{.TAG}}

  release:
    desc: "The full manual deploy sequence from docs/runbook/deployment.md. Usage: task cd:release TAG=v1.2.3"
    requires:
      vars: [TAG]
    cmds:
      - task: preflight
      - task: deploy
        vars: { TAG: "{{.TAG}}" }
      - task: verify
        vars: { TAG: "{{.TAG}}" }
      - task: smoke
