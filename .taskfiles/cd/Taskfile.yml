# scripts/dokploy.ts, one task per subcommand -- CI runs these, and an operator runs the
# same commands by hand for a manual deploy or a rollback. The Dokploy API is the only
# channel for a change; see .claude/rules/deployment.md and docs/runbook/deployment.md.
#
# Credentials (DOKPLOY_API_ENDPOINT/API_KEY/COMPOSE_ID) come from the ambient environment,
# exactly as they do for `bun run scripts/dokploy.ts` today -- Task does not manage them.
version: "3"

tasks:
  preflight:
    desc: Assert the Dokploy panel points at published images with the right compose flags.
    cmds:
      - bun run scripts/dokploy.ts preflight

  deploy:
    desc: "Trigger a deploy and wait for it to settle. Usage: task cd:deploy TAG=v1.2.3"
    requires:
      vars: [TAG]
    cmds:
      - bun run scripts/dokploy.ts deploy {{.TAG}}

  verify:
    desc: "Prove the host runs the published images for TAG. Usage: task cd:verify TAG=v1.2.3"
    requires:
      vars: [TAG]
    cmds:
      - bun run scripts/dokploy.ts verify {{.TAG}}

  smoke:
    desc: Smoke-test a public URL (defaults to the production health endpoint).
    vars:
      URL: '{{.URL | default "https://undercroft.lowbit.link/api/health"}}'
    cmds:
      - bun run scripts/dokploy.ts smoke {{.URL}}

  logs:
    desc: Print the most recent Dokploy deployment's log.
    cmds:
      - bun run scripts/dokploy.ts logs

  status:
    desc: Print the compose stack's status and its most recent deployment.
    cmds:
      - bun run scripts/dokploy.ts status

  release:
    desc: "The full manual deploy sequence from docs/runbook/deployment.md. Usage: task cd:release TAG=v1.2.3"
    requires:
      vars: [TAG]
    cmds:
      - task: preflight
      - task: deploy
        vars: { TAG: "{{.TAG}}" }
      - task: verify
        vars: { TAG: "{{.TAG}}" }
      - task: smoke
