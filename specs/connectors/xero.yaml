# yaml-language-server: $schema=../schema/connector.v1.json
#
# Xero Accounting. The proof the spec format was not overfitted to HubSpot: oauth2 with
# refresh-token rotation, an account header carrying THEIR org id, page-number pagination,
# and hard pacing. Each entity names its own id field.
#
# A whole connector as configuration: no code per source.
apiVersion: undercroft.dev/v1
kind: Connector
id: xero
displayName: Xero Accounting
baseUrl: https://api.xero.com/api.xro/2.0

auth:
  kind: oauth2
  tokenUrl: https://identity.xero.com/connect/token
  # Xero invalidates the old refresh token the moment it is exchanged. The registry takes
  # SELECT ... FOR UPDATE before refreshing: two concurrent refreshes do not race, they
  # destroy the connection.
  rotatesRefreshToken: true
  # Granular scopes. Each entity below names the one Xero reads its list under (`readScope`), per
  # the `security` of each path in Xero's OpenAPI document (`xero_accounting.yaml`):
  #   accounting.invoices.read  /Invoices /CreditNotes /Quotes /PurchaseOrders /RepeatingInvoices
  #                             /LinkedTransactions
  #   accounting.payments.read  /Payments /Overpayments /Prepayments /BatchPayments
  #   accounting.contacts.read  /Contacts /ContactGroups
  #   accounting.settings.read  /Items /Accounts /TrackingCategories /TaxRates /Currencies
  # Xero no longer grants the broad accounting.transactions to a new app. A scope added here is a
  # new consent: add it in `oauthProviders.ts` too. A grant recorded without it still reads every
  # list it can, and each list it cannot is named in the run as not granted, never requested
  # (ADR 0071). `/Items` was once read under invoices; live Xero answers it 401 there (#276).
  scopes:
    [
      offline_access,
      accounting.invoices.read,
      accounting.payments.read,
      accounting.contacts.read,
      accounting.settings.read,
    ]
  # THEIR organisation id, from ops.connection.external_account_id. It is not our
  # tenant_id, and sending ours here is a 401 at best and the wrong org's books at worst.
  accountHeader: xero-tenant-id

defaults:
  headers: { Accept: application/json }
  # `page=1` goes on the FIRST request too. Asked with no `page`, Xero answers with every record
  # in a summary that drops invoices' and credit notes' line items (#268).
  pagination:
    kind: page-number
    param: page
    startAt: 1
    stopOn: empty-page
  rateLimit:
    # 60/min, 5,000/day, 5 concurrent per tenant. 1100ms leaves headroom for clock skew.
    # Do not lower this to make a backfill finish sooner: a 429 storm costs far more than
    # the time it saves.
    minIntervalMs: 1100
    requestsPerMinute: 60
    requestsPerDay: 5000
  retry:
    attempts: 5
    on: [429, 500, 502, 503, 504]
    respectRetryAfter: true
    maxRetryAfterMs: 120000 # a malformed header must not park a run for hours
  guards:
    failOnEmpty: true

# Xero filters server-side on a HEADER, not a query parameter: `If-Modified-Since` carries
# the last watermark and the endpoint returns only what changed after it. Client filtering
# would page the whole ledger to throw most of it away, and at 1100ms a request that is the
# expensive half of the run.
#
# Xero writes every date as a Microsoft JSON date, `/Date(1573755038314+0000)/`, and reads
# `If-Modified-Since` as RFC 3339. So the watermark is STORED exactly as `UpdatedDateUTC`
# arrived and ordered as `ms-json-date`, and SENT as the instant it names, in UTC and rounded
# down to the second (`send: rfc3339-seconds`). Rounding down asks for slightly more, never
# less. Sent verbatim, it would be a string Xero never accepts; ADR 0068. `updatedAtPath` is
# read the same way into `source_updated_at`, where the raw text once failed the whole run
# (#265). See `packages/connector-runtime/src/incremental.ts`.
entities:
  - name: contacts
    request: { kind: list, path: /Contacts, query: { pageSize: "100" } }
    readScope: accounting.contacts.read
    envelopePath: Contacts
    idPath: ContactID
    updatedAtPath: UpdatedDateUTC
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: invoices
    request: { kind: list, path: /Invoices, query: { pageSize: "100" } }
    readScope: accounting.invoices.read
    envelopePath: Invoices
    idPath: InvoiceID
    updatedAtPath: UpdatedDateUTC
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: payments
    request: { kind: list, path: /Payments, query: { pageSize: "100" } }
    readScope: accounting.payments.read
    envelopePath: Payments
    idPath: PaymentID
    updatedAtPath: UpdatedDateUTC
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  # Each entity names its own id field. A single hardcoded "InvoiceID" would silently key
  # credit notes on nothing.
  - name: credit_notes
    request: { kind: list, path: /CreditNotes, query: { pageSize: "100" } }
    readScope: accounting.invoices.read
    envelopePath: CreditNotes
    idPath: CreditNoteID
    updatedAtPath: UpdatedDateUTC
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  # The lists below are the rest of what the scopes above reach (issues 271 and 277). They do not
  # all read like the four above, and each difference is Xero's OpenAPI document's, not a choice:
  #
  # - `pagination: none` where Xero takes no `page`: /RepeatingInvoices, /Items, /BatchPayments,
  #   /ContactGroups and the four settings lists answer every record at once. Paged as the
  #   default pages, each would answer page two with page one again and never with the empty
  #   page the read stops on.
  # - No `pageSize` where Xero takes none: /Quotes and /LinkedTransactions page at 100.
  # - No `incremental` where Xero takes no `If-Modified-Since`: those lists are read whole every
  #   run, which costs nothing in the lake, where an unchanged record lands as unchanged.
  # - No `updatedAtPath` where the record carries no `UpdatedDateUTC`: absent is honest.
  #
  # `failOnEmpty: false` on every one, because an organisation with no quotes, no purchase orders
  # or no contact groups is ordinary, and the run must not fail on it -- for an unpaged or
  # non-incremental list, every run would. The guard exists for "failed after 0", which is what a
  # credential problem looks like, and on Xero that arrives as a 401 or 403, which raises; a list
  # whose `readScope` the grant lacks is never requested at all. An empty 200 from Xero is Xero's
  # own word that there is nothing.
  - name: quotes
    request: { kind: list, path: /Quotes }
    readScope: accounting.invoices.read
    envelopePath: Quotes
    idPath: QuoteID
    updatedAtPath: UpdatedDateUTC
    guards: { failOnEmpty: false }
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: purchase_orders
    request: { kind: list, path: /PurchaseOrders, query: { pageSize: "100" } }
    readScope: accounting.invoices.read
    envelopePath: PurchaseOrders
    idPath: PurchaseOrderID
    updatedAtPath: UpdatedDateUTC
    guards: { failOnEmpty: false }
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: repeating_invoices
    request: { kind: list, path: /RepeatingInvoices }
    readScope: accounting.invoices.read
    envelopePath: RepeatingInvoices
    idPath: RepeatingInvoiceID
    pagination: { kind: none }
    guards: { failOnEmpty: false }

  - name: linked_transactions
    request: { kind: list, path: /LinkedTransactions }
    readScope: accounting.invoices.read
    envelopePath: LinkedTransactions
    idPath: LinkedTransactionID
    updatedAtPath: UpdatedDateUTC
    guards: { failOnEmpty: false }

  - name: items
    request: { kind: list, path: /Items }
    readScope: accounting.settings.read
    envelopePath: Items
    idPath: ItemID
    updatedAtPath: UpdatedDateUTC
    pagination: { kind: none }
    guards: { failOnEmpty: false }
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: overpayments
    request: { kind: list, path: /Overpayments, query: { pageSize: "100" } }
    readScope: accounting.payments.read
    envelopePath: Overpayments
    idPath: OverpaymentID
    updatedAtPath: UpdatedDateUTC
    guards: { failOnEmpty: false }
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: prepayments
    request: { kind: list, path: /Prepayments, query: { pageSize: "100" } }
    readScope: accounting.payments.read
    envelopePath: Prepayments
    idPath: PrepaymentID
    updatedAtPath: UpdatedDateUTC
    guards: { failOnEmpty: false }
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: batch_payments
    request: { kind: list, path: /BatchPayments }
    readScope: accounting.payments.read
    envelopePath: BatchPayments
    idPath: BatchPaymentID
    updatedAtPath: UpdatedDateUTC
    pagination: { kind: none }
    guards: { failOnEmpty: false }
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: contact_groups
    request: { kind: list, path: /ContactGroups }
    readScope: accounting.contacts.read
    envelopePath: ContactGroups
    idPath: ContactGroupID
    pagination: { kind: none }
    guards: { failOnEmpty: false }

  # What the codes on a transaction's lines mean (issue 277): the chart of accounts an
  # `AccountCode` names, the tracking categories and options a line is tagged with, the tax rate a
  # `TaxType` names, and the currencies a `CurrencyCode` names. All four are read under
  # `accounting.settings.read`, answer every record at once and are read with no `where`, so an
  # archived account or tax rate lands beside the active ones: old transactions still name them.
  #
  # /TrackingCategories is the one that hides its archived records unless asked, so it asks.
  # Its options travel inside each category, so they land with it.
  #
  # /TaxRates and /Currencies carry no id and no change time. Each is keyed on the code the lines
  # carry -- a tax rate's `TaxType`, a currency's `Code` -- which Xero holds unique per
  # organisation, and neither takes `If-Modified-Since`, so both are read whole every run.
  - name: accounts
    request: { kind: list, path: /Accounts }
    readScope: accounting.settings.read
    envelopePath: Accounts
    idPath: AccountID
    updatedAtPath: UpdatedDateUTC
    pagination: { kind: none }
    guards: { failOnEmpty: false }
    incremental:
      strategy: header
      header: If-Modified-Since
      sourcePath: UpdatedDateUTC
      format: ms-json-date
      send: rfc3339-seconds

  - name: tracking_categories
    request: { kind: list, path: /TrackingCategories, query: { includeArchived: "true" } }
    readScope: accounting.settings.read
    envelopePath: TrackingCategories
    idPath: TrackingCategoryID
    pagination: { kind: none }
    guards: { failOnEmpty: false }

  - name: tax_rates
    request: { kind: list, path: /TaxRates }
    readScope: accounting.settings.read
    envelopePath: TaxRates
    idPath: TaxType
    pagination: { kind: none }
    guards: { failOnEmpty: false }

  - name: currencies
    request: { kind: list, path: /Currencies }
    readScope: accounting.settings.read
    envelopePath: Currencies
    idPath: Code
    pagination: { kind: none }
    guards: { failOnEmpty: false }
