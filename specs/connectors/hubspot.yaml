# yaml-language-server: $schema=../schema/connector.v1.json
#
# HubSpot CRM. Bearer auth against a sealed per-tenant credential; pagination by HubSpot's
# `after`; client-side incremental on the last-modified property of each object that has one.
#
# A whole connector as configuration: no code per source.
#
# Each object's `properties:` is a FLOOR, not the whole read. An admin may choose more of a
# portal's properties -- its own custom ones included -- through the connection's scope, and a
# run asks for the union of the two (ADR 0052). So a property listed here is read whatever
# anybody ticks, which is why each object's incremental property is listed here and must stay:
# a scope can add to this list and never take from it. With no scope chosen, this list is the
# read, exactly as before.
#
# A widened object is read in two steps (ADR 0054): the list below, exactly as written, names
# each page's records and carries the cursor, and HubSpot's batch read then fetches that page
# with the union in its POST body -- a portal's full list of contact properties is longer than
# any URL HubSpot accepts. The worker adds that step (`request.batchRead`); nothing here does.
#
# Each object is `removedWhen: absent` (ADR 0071). Its list asks for `archived=false`, which is
# every live record the portal holds, paged by record id -- and the client-filter watermark below
# never narrows it: every run pages the whole list and only skips LANDING what has not changed.
# So a run that reads an object to the end names every live record, and a record the lake holds
# that it no longer names has been archived, deleted or merged away; the worker marks it removed.
# A run that fails or stops partway decides nothing. `hs_merged_object_ids` is read so that a
# merge says where a record went: HubSpot writes the merged-away ids onto the record they merged
# into (a merge makes a NEW record id, and both old ids leave the live list).
#
# Every list is the objects API's (or the owners' and pipelines' own), paged by `after`, never
# the search endpoint -- which stops at 10,000 results for any query. So no list here has a cap,
# and there is deliberately no `failOnExactCount`: a portal with exactly 10,000 line items is a
# portal, not a truncation (ADR 0075, issue 279).
#
# Each entity names the scope a HubSpot private app needs to read it (`readScope`), and
# `docs/runbook/hubspot-setup.md` lists the same. A token without one is refused on that list's
# first request with a 403 whose category is `MISSING_SCOPES`; the run names the list as not
# granted, with the scope, and reads the rest (`grantRefusal`, ADR 0075).
apiVersion: undercroft.dev/v1
kind: Connector
id: hubspot
displayName: HubSpot CRM
baseUrl: https://api.hubapi.com

auth:
  kind: bearer
  token: { from: connection }
  grantRefusal: hubspot-missing-scopes

defaults:
  headers: { Accept: application/json }
  pagination:
    kind: json-link
    nextPath: paging.next.link
  rateLimit:
    requestsPerMinute: 100 # 110/10s burst on a Pro portal; leave headroom
  retry:
    attempts: 5
    on: [429, 500, 502, 503, 504]
    respectRetryAfter: true
  guards:
    failOnEmpty: true

entities:
  - name: companies
    request:
      kind: list
      path: /crm/v3/objects/companies
      query:
        limit: "100"
        archived: "false"
        properties: name,domain,industry,lifecyclestage,createdate,hs_lastmodifieddate,hubspot_owner_id,hs_merged_object_ids
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    incremental:
      strategy: client-filter
      sourcePath: properties.hs_lastmodifieddate
    readScope: crm.objects.companies.read
    removedWhen: absent

  - name: contacts
    request:
      kind: list
      path: /crm/v3/objects/contacts
      query:
        limit: "100"
        archived: "false"
        properties: firstname,lastname,email,company,createdate,lastmodifieddate,hubspot_owner_id,hs_merged_object_ids
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    incremental:
      strategy: client-filter
      # NOT hs_lastmodifieddate. HubSpot names it differently on contacts, and the
      # wrong name yields a cursor that never advances.
      sourcePath: properties.lastmodifieddate
    readScope: crm.objects.contacts.read
    removedWhen: absent

  - name: deals
    request:
      kind: list
      path: /crm/v3/objects/deals
      query:
        limit: "100"
        archived: "false"
        properties: dealname,dealstage,pipeline,amount,closedate,createdate,hs_lastmodifieddate,hubspot_owner_id,hs_merged_object_ids
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    incremental:
      strategy: client-filter
      sourcePath: properties.hs_lastmodifieddate
    readScope: crm.objects.deals.read
    removedWhen: absent

  # Not a CRM object: the deal-to-company edge, on a different route with a different
  # shape. Without it a deal has no owner and every deal-to-customer join is a guess --
  # so a failure here is fatal, not skippable. Only a token HubSpot says may not read it is
  # named instead, as every list is (`grantRefusal`).
  #
  # No updatedAtPath, on purpose: the v4 associations batch read answers `from`, `to` and
  # `associationTypes` only -- HubSpot keeps no change time on a link. source_updated_at is
  # therefore NULL on every association, and correctly so; filling it from the deal's
  # hs_lastmodifieddate or from observed_at would be a plausible wrong instant (ADR 0034,
  # issue 141). The consent copy (`source.hubspotReads`) tells the user the same.
  #
  # Every link below is read the same way and keeps this one's name for what it always was.
  # Each asks about every record its parent's read NAMED, not only the ones that changed, so a
  # link read added after its parent's watermark learns every record's links on its first run
  # (ADR 0075). v4 rather than v3: v3 answers a contact's primary company alone, and no kind or
  # label on any link; v4 answers every link with its `associationTypes` -- category, typeId and
  # label. A record with more links than one answer carries is read to its last page.
  - name: associations
    request:
      kind: batch-from
      entity: deals
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/deals/companies/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false # a portal with no associations is a real state
    readScope: crm.objects.companies.read
    # Keyed by the deal (`from.id`), so a deal's links are removed when the deal is, and live
    # again when it is. Decided by the deals listing: this read asks only about the deals that
    # listing named, so it could never say which deals are gone.
    removedWhen: parent-removed

  # The commerce objects, issue 279. Paged by `after` as a cursor rather than by HubSpot's next
  # link, so every value of the query -- `archived` above all -- is carried to the next page by
  # this spec rather than by however HubSpot writes its link. `failOnEmpty: false` on each: a
  # portal that has never quoted anything is a real state.
  - name: quotes
    request:
      kind: list
      path: /crm/v3/objects/quotes
      query:
        limit: "100"
        archived: "false"
        properties: hs_title,hs_status,hs_quote_number,hs_expiration_date,hs_quote_amount,hs_currency,hubspot_owner_id,hs_createdate,hs_lastmodifieddate
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    pagination: { kind: cursor, cursorPath: paging.next.after, param: after }
    incremental:
      strategy: client-filter
      sourcePath: properties.hs_lastmodifieddate
    guards:
      failOnEmpty: false
    readScope: crm.objects.quotes.read
    removedWhen: absent

  # `hs_product_id` is how a line item names its product: HubSpot's products cannot be
  # associated with anything, so there is no link to read. A line item added by hand has none.
  - name: line_items
    request:
      kind: list
      path: /crm/v3/objects/line_items
      query:
        limit: "100"
        archived: "false"
        properties: name,quantity,price,amount,hs_product_id,hs_sku,hs_line_item_currency_code,createdate,hs_lastmodifieddate
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    pagination: { kind: cursor, cursorPath: paging.next.after, param: after }
    incremental:
      strategy: client-filter
      sourcePath: properties.hs_lastmodifieddate
    guards:
      failOnEmpty: false
    readScope: crm.objects.line_items.read
    removedWhen: absent

  # Live and archived both, as one stream: a line item still names the product it was sold as
  # after that product is archived, and HubSpot lists archived records only when asked with
  # `archived=true` (`partitions`, ADR 0075). Each record says which it is in its own `archived`.
  # No watermark: whether archiving moves `hs_lastmodifieddate` is not documented, and a product
  # list is short, so it is read whole every run and an unchanged product lands as unchanged.
  - name: products
    request:
      kind: list
      path: /crm/v3/objects/products
      query:
        limit: "100"
        properties: name,price,hs_sku,description,createdate,hs_lastmodifieddate
      partitions:
        - { archived: "false" }
        - { archived: "true" }
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    pagination: { kind: cursor, cursorPath: paging.next.after, param: after }
    guards:
      failOnEmpty: false
    # HubSpot's scope reference names `e-commerce` for the products endpoints; the products
    # API also accepts `crm.objects.products.read`, where an app's scope list offers it.
    readScope: e-commerce
    removedWhen: absent

  # Active and deactivated, for the reason products are: an old deal still names the owner
  # who closed it. `id` is what a record's `hubspot_owner_id` holds; `userId` is not.
  # Read whole every run -- there are as many as there are seats -- and landed unchanged when
  # nothing moved.
  - name: owners
    request:
      kind: list
      path: /crm/v3/owners
      query:
        limit: "100"
      partitions:
        - { archived: "false" }
        - { archived: "true" }
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    pagination: { kind: cursor, cursorPath: paging.next.after, param: after }
    readScope: crm.objects.owners.read
    removedWhen: absent

  # Each deal pipeline with its stages nested in it: a stage's `label`, `displayOrder`, and
  # `metadata.isClosed` and `metadata.probability` -- strings, as HubSpot types them. One
  # unpaged answer, read whole every run; every portal has at least one deal pipeline.
  - name: deal_pipelines
    request:
      kind: list
      path: /crm/v3/pipelines/deals
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    pagination: { kind: none }
    readScope: crm.objects.deals.read
    removedWhen: absent

  # The links, each keyed by the record it hangs off and removed with it, like `associations`.
  # Every company a contact is linked to, each with its kind: `HUBSPOT_DEFINED` typeId 1 is the
  # primary company, typeId 279 an unlabelled link, and `USER_DEFINED` the portal's own labels.
  - name: contact_companies
    request:
      kind: batch-from
      entity: contacts
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/contacts/companies/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.companies.read
    removedWhen: parent-removed

  - name: deal_contacts
    request:
      kind: batch-from
      entity: deals
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/deals/contacts/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: parent-removed

  - name: deal_quotes
    request:
      kind: batch-from
      entity: deals
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/deals/quotes/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.quotes.read
    removedWhen: parent-removed

  - name: deal_line_items
    request:
      kind: batch-from
      entity: deals
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/deals/line_items/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.line_items.read
    removedWhen: parent-removed

  - name: quote_line_items
    request:
      kind: batch-from
      entity: quotes
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/quotes/line_items/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.line_items.read
    removedWhen: parent-removed

  - name: quote_contacts
    request:
      kind: batch-from
      entity: quotes
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/quotes/contacts/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: parent-removed

  - name: quote_companies
    request:
      kind: batch-from
      entity: quotes
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/quotes/companies/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.companies.read
    removedWhen: parent-removed

  # The activities logged on a record, issue 372: notes, calls and tasks, open and completed alike
  # (HubSpot lists both). Each is listed whole every run like the objects above, and links to the
  # companies, contacts and deals it is logged on below. HubSpot reads all three under the contacts
  # scope: there is no scope of their own.
  #
  # The text a person wrote -- `hs_note_body`, `hs_call_body`, `hs_task_body` -- is a DOCUMENT of
  # its record, never a field of it, exactly as a Gmail message's body is (ADR 0084, ADR 0101). The
  # runtime takes it out of the payload whatever asked for it, and the worker lands it as
  # `<entity>:<id>:body` (`notes:51:body`); a model reads it in `raw.document_text`. HubSpot caps it
  # at 65,536 characters, so it is always far under the 25 MiB a document may weigh.
  #
  # `neverRead` keeps out what a scope could otherwise add (ADR 0052): the body's own preview
  # copies, which are the same text, and on calls the recording, the transcript and the summary
  # made from it. None of them is ever asked of HubSpot, and no transcript API is ever called.
  #
  # `hubspot_owner_id` is the item's owner, an owner's `id`; `hs_created_by` is the HubSpot user who
  # logged it, an owner's `userId`. Owners above are read deactivated ones included, so both
  # resolve. `hs_attachment_ids` is the semicolon-separated list of the files attached to a note;
  # the files themselves are not read.
  - name: notes
    request:
      kind: list
      path: /crm/v3/objects/notes
      query:
        limit: "100"
        archived: "false"
        properties: hs_timestamp,hs_note_body,hubspot_owner_id,hs_created_by,hs_attachment_ids,hs_createdate,hs_lastmodifieddate
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    pagination: { kind: cursor, cursorPath: paging.next.after, param: after }
    incremental:
      strategy: client-filter
      sourcePath: properties.hs_lastmodifieddate
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: absent
    documents:
      - { path: properties.hs_note_body, part: body, contentType: text/html }
    neverRead: [hs_body_preview*]

  # `hs_call_disposition` is the outcome as a GUID; `call_dispositions` below says what each means.
  # `hs_call_duration` is in milliseconds. `hs_call_recording_url` is never read.
  - name: calls
    request:
      kind: list
      path: /crm/v3/objects/calls
      query:
        limit: "100"
        archived: "false"
        properties: hs_timestamp,hs_call_title,hs_call_body,hs_call_direction,hs_call_duration,hs_call_disposition,hs_call_status,hubspot_owner_id,hs_created_by,hs_createdate,hs_lastmodifieddate
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    pagination: { kind: cursor, cursorPath: paging.next.after, param: after }
    incremental:
      strategy: client-filter
      sourcePath: properties.hs_lastmodifieddate
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: absent
    documents:
      - { path: properties.hs_call_body, part: body, contentType: text/html }
    neverRead: [hs_body_preview*, "*recording*", "*transcri*", "*summary*"]

  # `hs_timestamp` is a task's due date; `hs_task_completion_date` is set once it is completed.
  - name: tasks
    request:
      kind: list
      path: /crm/v3/objects/tasks
      query:
        limit: "100"
        archived: "false"
        properties: hs_task_subject,hs_task_body,hs_task_status,hs_timestamp,hs_task_priority,hs_task_type,hs_task_completion_date,hubspot_owner_id,hs_created_by,hs_createdate,hs_lastmodifieddate
    envelopePath: results
    idPath: id
    updatedAtPath: updatedAt
    pagination: { kind: cursor, cursorPath: paging.next.after, param: after }
    incremental:
      strategy: client-filter
      sourcePath: properties.hs_lastmodifieddate
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: absent
    documents:
      - { path: properties.hs_task_body, part: body, contentType: text/html }
    neverRead: [hs_body_preview*]

  # What each `hs_call_disposition` GUID means, HubSpot's defaults and the portal's own outcomes,
  # read from the portal rather than written into anybody's model. The engagements API's own
  # answer: a top-level array of `{id, label, deleted}`, unpaged, so no `envelopePath`. HubSpot's
  # reference names no scope for it; it is read under the scope calls are.
  - name: call_dispositions
    request:
      kind: list
      path: /calling/v1/dispositions
    idPath: id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: absent

  # Every company, contact and deal each activity is logged on, keyed by the activity and removed
  # with it, like the links above. An activity on several records lands once, with a link to each.
  - name: note_companies
    request:
      kind: batch-from
      entity: notes
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/notes/companies/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.companies.read
    removedWhen: parent-removed

  - name: note_contacts
    request:
      kind: batch-from
      entity: notes
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/notes/contacts/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: parent-removed

  - name: note_deals
    request:
      kind: batch-from
      entity: notes
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/notes/deals/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.deals.read
    removedWhen: parent-removed

  - name: call_companies
    request:
      kind: batch-from
      entity: calls
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/calls/companies/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.companies.read
    removedWhen: parent-removed

  - name: call_contacts
    request:
      kind: batch-from
      entity: calls
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/calls/contacts/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: parent-removed

  - name: call_deals
    request:
      kind: batch-from
      entity: calls
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/calls/deals/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.deals.read
    removedWhen: parent-removed

  - name: task_companies
    request:
      kind: batch-from
      entity: tasks
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/tasks/companies/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.companies.read
    removedWhen: parent-removed

  - name: task_contacts
    request:
      kind: batch-from
      entity: tasks
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/tasks/contacts/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.contacts.read
    removedWhen: parent-removed

  - name: task_deals
    request:
      kind: batch-from
      entity: tasks
      idPath: id
      chunkSize: 100
      path: /crm/v4/associations/tasks/deals/batch/read
      bodyTemplate: hubspot-batch-inputs
    envelopePath: results
    idPath: from.id
    pagination: { kind: none }
    guards:
      failOnEmpty: false
    readScope: crm.objects.deals.read
    removedWhen: parent-removed
