version: 2

models:
  - name: stg_hubspot_deals
    description: HubSpot deals, one row per deal, projected from raw.records.
    columns:
      - name: deal_id
        description: The HubSpot deal id. Unique and present.
        tests:
          - not_null
          - unique
      - name: amount
        description: >
          Deal amount as numeric(18,4), or NULL when the source value is not a clean
          number. Never 0 for a missing value -- a fabricated zero is worse than a
          visibly empty cell.
