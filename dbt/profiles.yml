# The dbt connection profile.
#
# dbt connects as `undercroft_dbt` and as nothing else. That role has no USAGE on the `app`
# schema, so a model cannot read a credential; it can create only in `analytics` and `dq`.
# Those privileges — not the process boundary — are what make it safe to run SQL a user
# wrote. See docs/adr/0005.
undercroft:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('UNDERCROFT_PG_HOST', 'postgres') }}"
      port: "{{ env_var('UNDERCROFT_PG_PORT', '5432') | int }}"
      dbname: "{{ env_var('UNDERCROFT_PG_DB', 'undercroft') }}"
      user: undercroft_dbt
      password: "{{ env_var('UNDERCROFT_DBT_PASSWORD') }}"
      schema: analytics
      threads: 4
