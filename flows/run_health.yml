id: run_health
namespace: vcdo

description: |
  Evaluate run health and fail loudly on a critical signal.

  Runs hourly rather than after each pipeline, because the signal that matters
  most -- a source going SILENT -- is invisible from inside a run that never
  happened. A check that only executes when the pipeline does cannot detect the
  pipeline not executing.

  Thresholds live in vcdo/core/alerts.py and are declared there as untuned
  starting points with stated reasons. Binary signals (stage errored, rows
  unaccounted, source silent) carry no threshold at all.

labels:
  owner: data-platform
  kind: observability

concurrency:
  behavior: CANCEL
  limit: 1

tasks:
  - id: evaluate
    type: io.kestra.plugin.core.http.Request
    uri: http://worker:8081/run/alerts
    method: POST
    contentType: application/json
    body: "{}"
    headers:
      Authorization: "Bearer {{ envs.trigger_token }}"
    options:
      readIdleTimeout: PT5M
      connectTimeout: PT30S
      # A critical alert comes back as a 500, which must fail this task rather
      # than being swallowed as a handled response.
      allowFailed: true

  - id: assert_healthy
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.evaluate.code != 200 }}"
    errorMessage: |
      Run health check reported a CRITICAL signal.
      {{ outputs.evaluate.body }}

      Binary signals have no threshold and are never false alarms in the
      "needs tuning" sense: a stage errored, rows vanished with no exclusion
      reason, or a source that was reporting has stopped.

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "run health: {{ outputs.evaluate.body }}"

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 * * * *"
    timezone: Asia/Singapore

errors:
  - id: alert
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: |
      run_health FAILED. execution={{ execution.id }}
      Query ops.run_ledger for the stage, and dq.quarantine for rejected rows.
