id: xero_daily
namespace: vcdo

description: |
  Land Xero into the raw lake and publish behind the reconciliation gate.

  The gate blocks publish on any invoice that does not reconcile, any missing
  payment reference, or any unreadable amount. A blocked run FAILS this flow on
  purpose: accounting data that does not reconcile is not a degraded dashboard,
  it is a wrong one, and the previous generation keeps serving in the meantime.

  Runs after hubspot_daily rather than alongside it. Both publish generations
  into the same curated schema, and interleaving two publishes makes the run
  ledger far harder to read when something goes wrong.

labels:
  owner: data-platform
  source: xero

concurrency:
  behavior: FAIL
  limit: 1

tasks:
  - id: run_slice
    type: io.kestra.plugin.core.http.Request
    uri: http://worker:8081/run/slice
    method: POST
    contentType: application/json
    body: "{}"
    headers:
      Authorization: "Bearer {{ envs.trigger_token }}"
    options:
      readIdleTimeout: PT30M
      connectTimeout: PT30S

  - id: assert_published
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.run_slice.code != 200 }}"
    errorMessage: |
      Worker returned {{ outputs.run_slice.code }}.
      If the reconciliation gate blocked, this is CORRECT behaviour, not an outage:
      check ops.gate_finding for the invoice and the arithmetic that failed.
      Body: {{ outputs.run_slice.body }}

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "xero slice complete: {{ outputs.run_slice.body }}"

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 2 * * *"
    timezone: Asia/Singapore

errors:
  - id: alert
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: |
      xero_daily FAILED. execution={{ execution.id }}
      Check ops.gate_finding first -- a blocked gate is a refusal to publish wrong
      figures, and curated data is stale rather than incorrect.
