id: ingest_due
namespace: undercroft

description: |
  Every five minutes, ask the worker which (tenant, source) pairs are due and start
  each one.

  The tick is how late a run may start past its time. A preset cadence is a gap since the
  last run and a custom one is a cron expression (ADR 0059); either way this flow fires
  nothing by itself, and a cron that could fire more often than this tick is refused
  before it is stored. `SCHEDULER_TICK_MS` in packages/contracts/src/cadence.ts states the
  same five minutes; change the two together.

  The flow takes no input. Its predecessor took a `tenantId`, which meant one execution
  could read one customer and a schedule could only ever be one customer's -- so it
  scheduled nobody. The worker owns the schedule (`ops.connection.cadence` and `.cron`, and
  the rule in packages/contracts/src/cadence.ts); this flow is the tick.

  Calls the worker's HTTP trigger rather than running containers itself. Kestra therefore
  needs no access to the Docker socket, which on a shared host would make a Kestra
  compromise a host compromise. The trigger can start a fixed set of named verbs and
  nothing else.

  Each start answers 202 with the run's id and the worker carries on without us; the
  ledger is the record of what happened next. A 409 is a pair already running -- the
  worker's own guard -- and is not a failure of this flow, hence `allowFailed`.

  Concurrency CANCEL: a tick that finds the previous one still running has nothing to
  add, because the previous one already asked the same question.

labels:
  owner: data-platform

concurrency:
  behavior: CANCEL
  limit: 1

tasks:
  - id: due
    type: io.kestra.plugin.core.http.Request
    uri: http://undercroft-worker:8081/v1/runs/due
    method: GET
    headers:
      Authorization: "Bearer {{ envs.trigger_token }}"
      # The worker tags this request's trace with it, so a failed execution leads to
      # the server's side of it. ADR 0058.
      x-kestra-execution-id: "{{ execution.id }}"
    options:
      # Kestra 2.x nests the two timeouts under `timeout`; they were flat in 1.x and the
      # server rejects the old spelling outright (422, "Unrecognized field").
      timeout:
        connectTimeout: PT30S
        readIdleTimeout: PT1M

  - id: start
    # `Loop`, not `ForEach`: 2.x dropped the ForEach type outright and the server answers
    # "Invalid type" for it. It is NOT a plain rename -- Loop runs each iteration as its own
    # SUB-EXECUTION, which is why the body below reads `item.value` -- the spelling in
    # Kestra's own example -- and not 1.x's `taskrun.value`, which is not in scope in a
    # sub-execution. That failure is at RENDER time and the flow validator does not see
    # it: a flow can validate clean and still fail on its first real iteration.
    type: io.kestra.plugin.core.flow.Loop
    # `fromJson`, not `json`: 2.x removed the `json` Pebble function and the expression
    # fails at render time with "Function or Macro [json] does not exist" -- which the
    # flow validator does NOT catch, because it only type-checks the task graph.
    values: "{{ fromJson(outputs.due.body).due }}"
    concurrencyLimit: 1
    tasks:
      - id: ingest
        type: io.kestra.plugin.core.http.Request
        uri: http://undercroft-worker:8081/v1/runs/ingest
        method: POST
        contentType: application/json
        body: "{{ item.value }}"
        headers:
          Authorization: "Bearer {{ envs.trigger_token }}"
          # The worker tags this request's trace with it, so a failed execution leads to
          # the server's side of it. ADR 0058.
          x-kestra-execution-id: "{{ execution.id }}"
        options:
          # A 409 is a pair already running -- the worker's own guard -- and is not a
          # failure of this flow. In 2.x `allowFailed` is an HTTP option, not a task
          # property: at task level the server rejects it.
          allowFailed: true
          timeout:
            connectTimeout: PT30S
            readIdleTimeout: PT1M

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "asked the worker to start {{ fromJson(outputs.due.body).due | length }} due pair(s)"

triggers:
  - id: every_5_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"

errors:
  - id: alert
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: |
      ingest_due FAILED. execution={{ execution.id }}
      The worker could not be asked what is due. Nothing was started; the previous data
      keeps serving, stale rather than wrong.
