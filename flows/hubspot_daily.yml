id: hubspot_daily
namespace: vcdo

description: |
  Land HubSpot into the raw lake, curate it, and publish a generation.

  Calls the worker's HTTP trigger rather than running containers itself. Kestra
  therefore needs no access to the Docker socket, which on a shared host would
  make a Kestra compromise a host compromise. The trigger can start exactly
  three named verbs and nothing else.

  Concurrency is limited to one run. The worker refuses an overlapping run with
  409 anyway, but failing here is clearer than a queue of executions that all
  end in the same conflict.

labels:
  owner: data-platform
  source: hubspot

concurrency:
  behavior: FAIL
  limit: 1

tasks:
  - id: run_slice
    type: io.kestra.plugin.core.http.Request
    uri: http://worker:8081/run/slice
    method: POST
    contentType: application/json
    body: "{}"
    headers:
      Authorization: "Bearer {{ envs.trigger_token }}"
    options:
      # A full slice is minutes, not seconds, once real sources are attached.
      # A short timeout here would kill a healthy run mid-publish.
      readIdleTimeout: PT30M
      connectTimeout: PT30S

  - id: assert_published
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.run_slice.code != 200 }}"
    errorMessage: |
      Worker returned {{ outputs.run_slice.code }} rather than 200.
      Body: {{ outputs.run_slice.body }}

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "hubspot slice complete: {{ outputs.run_slice.body }}"

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    # 02:00 Asia/Singapore. Before the working day, after most upstream systems
    # have settled overnight.
    cron: "0 2 * * *"
    timezone: Asia/Singapore

errors:
  - id: alert
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: |
      hubspot_daily FAILED. execution={{ execution.id }}
      A failed run leaves the previous generation serving; curated data is stale,
      not wrong. The worker's response body names the exception type; check
      dq.quarantine for rejected rows and the worker's JSONL log for the stage.
