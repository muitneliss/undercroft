# The whole platform, as one `docker compose up`.
#
# There is no ingestion platform here: no Airbyte, no Meltano, no Kubernetes. One worker
# container ingests and one control-plane container configures it; dbt runs in its own
# container invoked by Kestra. Every service declares a memory limit, and CI asserts it --
# a service with no ceiling can starve the others on a small host.
name: undercroft

x-restart: &restart
  restart: unless-stopped

services:
  minio:
    <<: *restart
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${UNDERCROFT_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${UNDERCROFT_S3_SECRET_KEY:?set in .env}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "127.0.0.1:${UNDERCROFT_PORT_MINIO:-19000}:9000"
      - "127.0.0.1:${UNDERCROFT_PORT_MINIO_CONSOLE:-19001}:9001"
    deploy:
      resources:
        limits:
          memory: 1g

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$UNDERCROFT_S3_ACCESS_KEY $$UNDERCROFT_S3_SECRET_KEY &&
      mc mb --ignore-existing local/${UNDERCROFT_S3_BUCKET_RAW:-undercroft-raw} &&
      echo done
      "
    environment:
      UNDERCROFT_S3_ACCESS_KEY: ${UNDERCROFT_S3_ACCESS_KEY:?set in .env}
      UNDERCROFT_S3_SECRET_KEY: ${UNDERCROFT_S3_SECRET_KEY:?set in .env}
    deploy:
      resources:
        limits:
          memory: 128m

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${UNDERCROFT_PG_USER:-undercroft}
      POSTGRES_PASSWORD: ${UNDERCROFT_PG_PASSWORD:?set in .env}
      POSTGRES_DB: ${UNDERCROFT_PG_DB:-undercroft}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UNDERCROFT_PG_USER:-undercroft}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${UNDERCROFT_PORT_POSTGRES:-15432}:5432"
    deploy:
      resources:
        limits:
          memory: 1g

  kestra-postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${UNDERCROFT_KESTRA_PG_PASSWORD:?set in .env}
      POSTGRES_DB: kestra
    volumes: [kestra-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # Make Kestra's two volumes writable by the user Kestra actually runs as.
  #
  # WITHOUT THIS KESTRA CRASH-LOOPS AND THE WHOLE SCHEDULE IS DEAD. A named volume is created
  # root-owned; `kestra/kestra:v2.0.2` runs as uid 1000 (`docker exec kestra id` ->
  # `uid=1000(kestra)`), so `PluginManager.createLocalRepositoryIfNotExist` cannot mkdir
  # `/app/storage/plugins` and the server exits with `AccessDeniedException` before it serves
  # a request.
  #
  # The symptom is why this is a one-shot and not a comment somewhere: nothing goes red.
  # Kestra restarts forever, `kestra-flows` cannot reach it, zero flows are ever registered,
  # and every run in the ledger quietly arrives with `trigger: manual` because a human started
  # it. Measured on the server before this fix: `select count(*) from flows` -> 0,
  # `select count(*) from executions` -> 0, volumes root-owned since they were created.
  #
  # `chown -R` rather than `chown`: the first run has two empty directories, but a re-run
  # after Kestra has written storage must not leave that content unreachable. Idempotent, so
  # it costs a second on every deploy and nothing else.
  kestra-init:
    # Deliberately NOT `<<: *restart`, for the reason `db-migrate` gives: this is meant to
    # exit, and `restart: unless-stopped` would turn a completed chown into a crash-loop.
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:1000 /app/storage /tmp/kestra-wd && echo done"]
    # Mounted at Kestra's own paths, so the thing being fixed is named the same way in both
    # services and a path change here cannot silently miss.
    volumes:
      - kestra-storage:/app/storage
      - kestra-workdir:/tmp/kestra-wd
    deploy:
      resources:
        limits:
          memory: 64m

  kestra:
    <<: *restart
    image: kestra/kestra:v2.0.2
    command: server standalone
    depends_on:
      kestra-postgres:
        condition: service_healthy
      # Before the server starts, not eventually: the plugin directory is created during
      # startup, so a chown that lands afterwards is a chown that lands too late.
      kestra-init:
        condition: service_completed_successfully
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            username: kestra
            password: ${UNDERCROFT_KESTRA_PG_PASSWORD}
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tutorialFlows:
            enabled: false
          server:
            basic-auth:
              username: ${UNDERCROFT_KESTRA_USER:-admin@example.com}
              password: ${UNDERCROFT_KESTRA_PASSWORD}
      # `{{ envs.trigger_token }}` resolves to ENV_TRIGGER_TOKEN. The prefix is ENV_, not
      # KESTRA_: a KESTRA_-prefixed variable can override Micronaut config and become
      # readable from every flow.
      ENV_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN:?set in .env}
    # No Docker socket is mounted. Kestra triggers work by calling the worker's HTTP verb
    # allowlist; it never runs containers itself, so a Kestra compromise is not a host
    # compromise. dbt runs via the dbt container the worker invokes, not via a task runner.
    volumes:
      - kestra-storage:/app/storage
      - kestra-workdir:/tmp/kestra-wd
    ports:
      - "127.0.0.1:${UNDERCROFT_PORT_KESTRA:-18080}:8080"
    deploy:
      resources:
        limits:
          memory: 2g

  worker:
    <<: *restart
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The worker needs the buckets before it lands anything; waiting on the one-shot
      # creator also keeps `docker compose up --wait` from reading its clean exit as a crash.
      minio-init:
        condition: service_completed_successfully
      # The worker reads and writes `raw`, so it waits for the schema too.
      db-migrate:
        condition: service_completed_successfully
      # And for the flows to be in Kestra: a stack whose flows never landed schedules
      # nothing, and that is a failed deploy rather than a quiet one.
      kestra-flows:
        condition: service_completed_successfully
    environment:
      # As its own role, never as the bootstrap superuser; `db-migrate` sets the password.
      UNDERCROFT_POSTGRES_DSN: postgres://undercroft_worker:${UNDERCROFT_WORKER_PG_PASSWORD:?set in .env}@postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_S3_ENDPOINT: http://minio:9000
      UNDERCROFT_S3_BUCKET_RAW: ${UNDERCROFT_S3_BUCKET_RAW:-undercroft-raw}
      UNDERCROFT_S3_ACCESS_KEY: ${UNDERCROFT_S3_ACCESS_KEY}
      UNDERCROFT_S3_SECRET_KEY: ${UNDERCROFT_S3_SECRET_KEY}
      UNDERCROFT_SECRET_KEY: ${UNDERCROFT_SECRET_KEY:?set in .env}
      UNDERCROFT_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN}
      # Per-tenant Gmail and Drive ingestion. A SECOND Google client, never the sign-in
      # one above: signing in asks for `openid email profile`, this asks for a customer's
      # mailbox. One client carrying both scope lists is one misconfiguration away from
      # handing over a mailbox as a side effect of signing in. See docs/adr/0016.
      # Unset means the consent flow does not exist and every Google source reads
      # "not connected" -- the right state while Google verification is pending.
      UNDERCROFT_GOOGLE_INGEST_CLIENT_ID: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET:-}
      # Milliseconds between two Gmail/Drive requests. Unset paces three a second, inside
      # the 2-4 messages.get/second/user Google enforces for this project -- a sixth of the
      # published rate, and the reason a 7,777-message backfill died 378 messages in. Set it
      # only to match a project whose enforced quota differs; a bad value fails the run
      # rather than quietly pacing at the rate that caused the outage.
      UNDERCROFT_GOOGLE_MIN_INTERVAL_MS: ${UNDERCROFT_GOOGLE_MIN_INTERVAL_MS:-}
      # The Xero client, for refreshing and revoking; the control plane runs the consent.
      UNDERCROFT_XERO_CLIENT_ID: ${UNDERCROFT_XERO_CLIENT_ID:-}
      UNDERCROFT_XERO_CLIENT_SECRET: ${UNDERCROFT_XERO_CLIENT_SECRET:-}
      # dbt runs as a subprocess here (ADR 0007) as each TENANT'S OWN login (ADR 0018). The
      # worker mints that login's password right before a build and hands it to the child
      # by environment; no variable here carries a dbt password any more.
    deploy:
      resources:
        limits:
          memory: 1g

  # The schema, applied before anything reads it. Same image as the control plane, which
  # carries the migrations and the `migrate` script; it runs once and exits.
  #
  # A one-shot service rather than a call at service boot: the control plane may one day run
  # more than one replica, and two replicas racing the same DDL is a failure that only shows
  # up under the load you least want it to. `migrate()` is idempotent and ledgered, so
  # re-running on every deploy costs one query.
  #
  # Without this, a deploy that adds a table leaves the services pointed at a schema that
  # does not have it. Better Auth refuses EVERY request on a schema mismatch — it is not a
  # warning — so sign-in returns 500 until the migration lands.
  db-migrate:
    # Deliberately NOT `<<: *restart`. This is meant to exit, and `restart: unless-stopped`
    # would turn a completed migration into a crash-loop.
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.control-plane
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "migrate"]
    environment:
      # The one service that connects as the bootstrap superuser: it applies the schema and
      # sets the two platform roles' passwords from the variables below.
      UNDERCROFT_POSTGRES_DSN: postgres://${UNDERCROFT_PG_USER:-undercroft}:${UNDERCROFT_PG_PASSWORD}@postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_APP_PG_PASSWORD: ${UNDERCROFT_APP_PG_PASSWORD:?set in .env}
      UNDERCROFT_WORKER_PG_PASSWORD: ${UNDERCROFT_WORKER_PG_PASSWORD:?set in .env}
    deploy:
      resources:
        limits:
          memory: 256m

  # The Kestra flows, delivered by the deploy: `flows/` is baked into the control-plane
  # image and this one-shot pushes each file through Kestra's API, then exits. It waits for
  # Kestra to answer and fails at once on a flow Kestra rejects. See the server file.
  kestra-flows:
    # Deliberately NOT `<<: *restart`, for the reason `db-migrate` gives.
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.control-plane
    depends_on:
      kestra:
        condition: service_started
    command: ["bun", "run", "kestra:flows"]
    environment:
      UNDERCROFT_KESTRA_URL: http://kestra:8080
      UNDERCROFT_KESTRA_USER: ${UNDERCROFT_KESTRA_USER:-admin@example.com}
      UNDERCROFT_KESTRA_PASSWORD: ${UNDERCROFT_KESTRA_PASSWORD:?set in .env}
    deploy:
      resources:
        limits:
          memory: 128m

  control-plane:
    <<: *restart
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.control-plane
    depends_on:
      postgres:
        condition: service_healthy
      # The schema must exist before the first request, not eventually.
      db-migrate:
        condition: service_completed_successfully
    environment:
      # As its own role; see the worker's note.
      UNDERCROFT_POSTGRES_DSN: postgres://undercroft_app:${UNDERCROFT_APP_PG_PASSWORD:?set in .env}@postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_SECRET_KEY: ${UNDERCROFT_SECRET_KEY}
      UNDERCROFT_SESSION_SECRET: ${UNDERCROFT_SESSION_SECRET:?set in .env}
      UNDERCROFT_WORKER_URL: http://worker:8081
      UNDERCROFT_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN}
      # Sign-in. All optional: with any of them unset the process starts with no way in and
      # says so once at boot, rather than offering a button that fails at the first click.
      #
      # The public URL is the one the BROWSER uses, because Better Auth builds Google's
      # redirect_uri from it. A container-internal name here is a redirect_uri_mismatch.
      UNDERCROFT_PUBLIC_URL: ${UNDERCROFT_PUBLIC_URL:-http://localhost:13000}
      UNDERCROFT_GOOGLE_CLIENT_ID: ${UNDERCROFT_GOOGLE_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_CLIENT_SECRET:-}
      # Per-tenant Gmail and Drive ingestion. A SECOND Google client, never the sign-in
      # one above: signing in asks for `openid email profile`, this asks for a customer's
      # mailbox. One client carrying both scope lists is one misconfiguration away from
      # handing over a mailbox as a side effect of signing in. See docs/adr/0016.
      # Unset means the consent flow does not exist and every Google source reads
      # "not connected" -- the right state while Google verification is pending.
      UNDERCROFT_GOOGLE_INGEST_CLIENT_ID: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET:-}
      # Public values, for Drive's browser Picker only: they identify the app and
      # authorise nothing. Without them the Gmail half still works and the Drive picker
      # says it is unavailable.
      UNDERCROFT_GOOGLE_PICKER_API_KEY: ${UNDERCROFT_GOOGLE_PICKER_API_KEY:-}
      UNDERCROFT_GOOGLE_PROJECT_NUMBER: ${UNDERCROFT_GOOGLE_PROJECT_NUMBER:-}
      # The Xero client, for the consent. See docs/runbook/xero-setup.md.
      UNDERCROFT_XERO_CLIENT_ID: ${UNDERCROFT_XERO_CLIENT_ID:-}
      UNDERCROFT_XERO_CLIENT_SECRET: ${UNDERCROFT_XERO_CLIENT_SECRET:-}
      UNDERCROFT_EMAIL_API_KEY: ${UNDERCROFT_EMAIL_API_KEY:-}
      UNDERCROFT_EMAIL_FROM: ${UNDERCROFT_EMAIL_FROM:-}
      UNDERCROFT_EMAIL_API_URL: ${UNDERCROFT_EMAIL_API_URL:-}
      # The platform administrators: a comma-separated list of addresses that may sign in
      # with no invitation and hold admin in every tenant. This variable IS the authority —
      # removing an address and redeploying withdraws it. See ADR 0013.
      UNDERCROFT_SUPERADMINS: ${UNDERCROFT_SUPERADMINS:-}
    ports:
      - "127.0.0.1:${UNDERCROFT_PORT_API:-13000}:3000"
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  minio-data:
  postgres-data:
  kestra-postgres-data:
  kestra-storage:
  kestra-workdir:
