# VietCham data platform — service stack.
#
# This file is the source of truth. Dokploy holds a copy, pushed through the API
# as raw compose; it is never edited on the server. Direct edits bypass Dokploy's
# state and produce drift where the dashboard and the host disagree.
#
# Memory limits are mandatory on every service, not tuning. We are a tenant on a
# shared host that already runs 26 containers for eleven other projects, with
# 11 GiB free and **no swap** — so overcommit is an abrupt OOM kill, not a
# slowdown. A limit turns "the host fell over" into "one container restarted".
# See docs/adr/0001.
#
# Nothing here publishes a port to the internet. Ports are bound to localhost for
# development; in Dokploy, only Metabase gets a domain. MinIO, Postgres and
# Kestra stay on the internal network.
#
# Host ports are configurable and default off the well-known numbers. A dev
# machine usually already has something on 5432/8080/3000, and a stack that
# refuses to start on a colleague's laptop is a stack they stop running.

name: vcdo

x-restart: &restart
  restart: unless-stopped

services:
  minio:
    <<: *restart
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VCDO_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${VCDO_S3_SECRET_KEY:?set in .env}
    ports:
      - "127.0.0.1:${VCDO_PORT_MINIO:-19000}:9000"
      - "127.0.0.1:${VCDO_PORT_MINIO_CONSOLE:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  # Creates the buckets on first start, then exits. Idempotent: `mb --ignore-existing`
  # so a restart is not an error, and re-running never disturbs existing objects.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      VCDO_S3_ACCESS_KEY: ${VCDO_S3_ACCESS_KEY:?set in .env}
      VCDO_S3_SECRET_KEY: ${VCDO_S3_SECRET_KEY:?set in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$VCDO_S3_ACCESS_KEY $$VCDO_S3_SECRET_KEY &&
      mc mb --ignore-existing local/vcc-raw &&
      mc mb --ignore-existing local/vcc-quarantine &&
      mc mb --ignore-existing local/vcc-curated &&
      mc anonymous set none local/vcc-raw &&
      mc anonymous set none local/vcc-quarantine &&
      mc anonymous set none local/vcc-curated &&
      echo 'buckets ready'
      "
    deploy:
      resources:
        limits:
          memory: 128m

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${VCDO_PG_USER:-vcdo}
      POSTGRES_PASSWORD: ${VCDO_PG_PASSWORD:?set in .env}
      POSTGRES_DB: ${VCDO_PG_DB:-vcdo}
    ports:
      - "127.0.0.1:${VCDO_PORT_POSTGRES:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VCDO_PG_USER:-vcdo} -d ${VCDO_PG_DB:-vcdo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # Kestra's own metadata database. Deliberately separate from the curated store:
  # an orchestrator that shares a database with the data it publishes cannot be
  # restored independently, and a curated-layer restore would roll back the
  # scheduler's own history with it.
  kestra-postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${VCDO_KESTRA_PG_PASSWORD:?set in .env}
      POSTGRES_DB: kestra
    volumes:
      - kestra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  kestra:
    <<: *restart
    image: kestra/kestra:v0.24.1
    command: server standalone
    depends_on:
      kestra-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            username: kestra
            password: ${VCDO_KESTRA_PG_PASSWORD}
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          # Off by default Kestra loads 8 "Getting Started" blueprint flows.
          # An orchestrator that ships with flows nobody wrote is noise at best,
          # and the flow list stops being an inventory of our own pipelines.
          tutorialFlows:
            enabled: false
          server:
            basic-auth:
              username: ${VCDO_KESTRA_USER:-admin@vietcham.local}
              password: ${VCDO_KESTRA_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/ui/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    ports:
      - "127.0.0.1:${VCDO_PORT_KESTRA:-18080}:8080"
    volumes:
      - kestra-storage:/app/storage
      - kestra-workdir:/tmp/kestra-wd
    deploy:
      resources:
        limits:
          memory: 2g

  # Metabase's application database. Metabase stores its questions, dashboards
  # and permissions here, so this volume is business content, not a cache — it is
  # part of the backup set, not something to be recreated from scratch.
  metabase-postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${VCDO_METABASE_PG_PASSWORD:?set in .env}
      POSTGRES_DB: metabase
    volumes:
      - metabase-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  metabase:
    <<: *restart
    image: metabase/metabase:v0.56.8
    depends_on:
      metabase-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${VCDO_METABASE_PG_PASSWORD:?set in .env}
      JAVA_TOOL_OPTIONS: -Xmx1g
    ports:
      - "127.0.0.1:${VCDO_PORT_METABASE:-13000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  minio-data:
  postgres-data:
  kestra-postgres-data:
  kestra-storage:
  kestra-workdir:
  metabase-postgres-data:
