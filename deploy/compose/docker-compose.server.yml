# The platform as deployed — SERVER VARIANT of docker-compose.yml.
#
# Dokploy holds a copy of this file, pushed through the API as raw compose. This file is
# the source of truth; the copy is never edited on the server, because a direct edit is
# drift the next deploy silently reverts.
#
# Three differences from the development file, each of which is a failure that has already
# happened once on this host:
#
#   1. The first-party services use PUBLISHED IMAGES. Dokploy raw compose has no repo
#      checkout, so `build:` has no context and cannot work there.
#   2. NO host ports. The development file binds five to 127.0.0.1 for convenience. Here,
#      only the control plane is reachable, through Dokploy's proxy. MinIO, Postgres and
#      Kestra each hold or can reach customer data, on a host shared with eleven other
#      projects.
#   3. Every service carries a UNIQUE NETWORK ALIAS and every reference uses it. A service
#      with a domain is attached to the shared `dokploy-network` as well as ours, and on
#      that network `postgres` and `minio` are names other projects use too. The Metabase
#      this stack used to carry resolved plain `postgres` to ANOTHER PROJECT'S database and
#      tried to authenticate against it; only a password mismatch stopped the connection.
#      Metabase is gone (ADR 0020: the Reports division is first-party), the lesson stays.
#
# IMAGE_TAG is the deploy pointer. It defaults to `latest`, which the release pipeline
# moves to the version it just published; the immutable `vX.Y.Z` tag is pushed alongside,
# and `scripts/dokploy.ts verify` checks the running containers against it. A rollback is
# IMAGE_TAG=v1.2.3 in the Dokploy environment and a redeploy — no file change.
#
# Memory limits are mandatory, not tuning: this host has NO SWAP, so an unlimited container
# turns a spike into an OOM kill that takes a neighbour down with it. CI asserts every
# service declares one.

name: undercroft

x-restart: &restart
  restart: unless-stopped

services:
  minio:
    <<: *restart
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${UNDERCROFT_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${UNDERCROFT_S3_SECRET_KEY:?set in .env}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      default:
        aliases:
          - undercroft-minio
    deploy:
      resources:
        limits:
          memory: 1g

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://undercroft-minio:9000 $$UNDERCROFT_S3_ACCESS_KEY $$UNDERCROFT_S3_SECRET_KEY &&
      mc mb --ignore-existing local/${UNDERCROFT_S3_BUCKET_RAW:-undercroft-raw} &&
      mc anonymous set none local/${UNDERCROFT_S3_BUCKET_RAW:-undercroft-raw} &&
      echo done
      "
    environment:
      UNDERCROFT_S3_ACCESS_KEY: ${UNDERCROFT_S3_ACCESS_KEY:?set in .env}
      UNDERCROFT_S3_SECRET_KEY: ${UNDERCROFT_S3_SECRET_KEY:?set in .env}
    deploy:
      resources:
        limits:
          memory: 128m

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${UNDERCROFT_PG_USER:-undercroft}
      POSTGRES_PASSWORD: ${UNDERCROFT_PG_PASSWORD:?set in .env}
      POSTGRES_DB: ${UNDERCROFT_PG_DB:-undercroft}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UNDERCROFT_PG_USER:-undercroft}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - undercroft-postgres
    deploy:
      resources:
        limits:
          memory: 1g

  kestra-postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${UNDERCROFT_KESTRA_PG_PASSWORD:?set in .env}
      POSTGRES_DB: kestra
    volumes: [kestra-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - undercroft-kestra-postgres
    deploy:
      resources:
        limits:
          memory: 512m

  # Make Kestra's two volumes writable by the user Kestra actually runs as.
  #
  # WITHOUT THIS KESTRA CRASH-LOOPS AND THE WHOLE SCHEDULE IS DEAD. A named volume is created
  # root-owned; `kestra/kestra:v2.0.2` runs as uid 1000 (`docker exec kestra id` ->
  # `uid=1000(kestra)`), so `PluginManager.createLocalRepositoryIfNotExist` cannot mkdir
  # `/app/storage/plugins` and the server exits with `AccessDeniedException` before it serves
  # a request.
  #
  # The symptom is why this is a one-shot and not a comment somewhere: nothing goes red.
  # Kestra restarts forever, `kestra-flows` cannot reach it, zero flows are ever registered,
  # and every run in the ledger quietly arrives with `trigger: manual` because a human started
  # it. Measured on this host before the fix: `select count(*) from flows` -> 0,
  # `select count(*) from executions` -> 0, both volumes root-owned since 2026-09-17. The
  # scheduler had never run once, and `ingest_due` looked deployed the whole time.
  #
  # `chown -R` rather than `chown`: the first run has two empty directories, but a re-run
  # after Kestra has written storage must not leave that content unreachable. Idempotent, so
  # it costs a second on every deploy and nothing else.
  kestra-init:
    # Deliberately NOT `<<: *restart`, for the reason `db-migrate` gives: this is meant to
    # exit, and `restart: unless-stopped` would turn a completed chown into a crash-loop.
    image: alpine:3.24
    command: ["sh", "-c", "chown -R 1000:1000 /app/storage /tmp/kestra-wd && echo done"]
    # Mounted at Kestra's own paths, so the thing being fixed is named the same way in both
    # services and a path change here cannot silently miss.
    volumes:
      - kestra-storage:/app/storage
      - kestra-workdir:/tmp/kestra-wd
    deploy:
      resources:
        limits:
          memory: 64m

  kestra:
    <<: *restart
    image: kestra/kestra:v2.0.2
    command: server standalone
    depends_on:
      kestra-postgres:
        condition: service_healthy
      # Before the server starts, not eventually: the plugin directory is created during
      # startup, so a chown that lands afterwards is a chown that lands too late.
      kestra-init:
        condition: service_completed_successfully
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://undercroft-kestra-postgres:5432/kestra
            username: kestra
            password: ${UNDERCROFT_KESTRA_PG_PASSWORD}
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tutorialFlows:
            enabled: false
          server:
            basic-auth:
              username: ${UNDERCROFT_KESTRA_USER:-admin@example.com}
              password: ${UNDERCROFT_KESTRA_PASSWORD}
      # `{{ envs.trigger_token }}` resolves to ENV_TRIGGER_TOKEN. The prefix is ENV_, not
      # KESTRA_: a KESTRA_-prefixed variable can override Micronaut config and become
      # readable from every flow.
      ENV_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN:?set in .env}
    # No Docker socket is mounted. Kestra triggers work by calling the worker's HTTP verb
    # allowlist; it never runs containers itself, so a Kestra compromise is not a host
    # compromise.
    #
    # Kestra has NO DOMAIN by design: it is an operator surface holding flow history, not a
    # customer one. To administer it, tunnel to it — see docs/runbook/deployment.md.
    volumes:
      - kestra-storage:/app/storage
      - kestra-workdir:/tmp/kestra-wd
    networks:
      default:
        aliases:
          - undercroft-kestra
    deploy:
      resources:
        limits:
          memory: 2g

  worker:
    <<: *restart
    image: ghcr.io/muitneliss/undercroft-worker:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The worker needs the buckets to exist before it lands anything, so it waits for the
      # one-shot creator to finish. This also keeps `docker compose up --wait` happy: a
      # completed dependency is a success, whereas an init container that just exits with no
      # dependent reads to --wait as a service that fell over.
      minio-init:
        condition: service_completed_successfully
      # The worker reads and writes `raw`, so it waits for the schema too.
      db-migrate:
        condition: service_completed_successfully
      # And for the flows to be in Kestra. Not because the worker needs them, but because a
      # stack whose flows never landed is a stack that schedules nothing, and that is a
      # failed deploy rather than a quiet one. `verify` reads this dependency as the sign
      # that `kestra-flows` is a job meant to exit.
      kestra-flows:
        condition: service_completed_successfully
    environment:
      # As its own role, never as the bootstrap superuser: the grant model in
      # packages/db/sql only binds when the process that runs a customer's data holds
      # exactly the privileges 040_grants.sql gives it. `db-migrate` sets this password.
      UNDERCROFT_POSTGRES_DSN: postgres://undercroft_worker:${UNDERCROFT_WORKER_PG_PASSWORD:?set in .env}@undercroft-postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_S3_ENDPOINT: http://undercroft-minio:9000
      UNDERCROFT_S3_BUCKET_RAW: ${UNDERCROFT_S3_BUCKET_RAW:-undercroft-raw}
      UNDERCROFT_S3_ACCESS_KEY: ${UNDERCROFT_S3_ACCESS_KEY:?set in .env}
      UNDERCROFT_S3_SECRET_KEY: ${UNDERCROFT_S3_SECRET_KEY:?set in .env}
      UNDERCROFT_SECRET_KEY: ${UNDERCROFT_SECRET_KEY:?set in .env}
      UNDERCROFT_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN:?set in .env}
      # Per-tenant Gmail and Drive ingestion. A SECOND Google client, never the sign-in
      # one above: signing in asks for `openid email profile`, this asks for a customer's
      # mailbox. One client carrying both scope lists is one misconfiguration away from
      # handing over a mailbox as a side effect of signing in. See docs/adr/0016.
      # Unset means the consent flow does not exist and every Google source reads
      # "not connected" -- the right state while Google verification is pending.
      UNDERCROFT_GOOGLE_INGEST_CLIENT_ID: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET:-}
      # Milliseconds between two Gmail/Drive requests. Unset paces three a second, inside
      # the 2-4 messages.get/second/user Google enforces for this project -- a sixth of the
      # published rate, and the reason a 7,777-message backfill died 378 messages in. Set it
      # only to match a project whose enforced quota differs; a bad value fails the run
      # rather than quietly pacing at the rate that caused the outage.
      UNDERCROFT_GOOGLE_MIN_INTERVAL_MS: ${UNDERCROFT_GOOGLE_MIN_INTERVAL_MS:-}
      # The Xero client, for refreshing (Xero rotates the pair) and revoking. The same two
      # values the control plane runs the consent with. Unset means Xero cannot be connected.
      UNDERCROFT_XERO_CLIENT_ID: ${UNDERCROFT_XERO_CLIENT_ID:-}
      UNDERCROFT_XERO_CLIENT_SECRET: ${UNDERCROFT_XERO_CLIENT_SECRET:-}
      # dbt runs as a subprocess in this image (ADR 0007) as each TENANT'S OWN login (ADR
      # 0018). The worker points the generated profile at the server its own DSN names and
      # mints the login's password right before a build; no variable here carries one.
    networks:
      default:
        aliases:
          - undercroft-worker
    deploy:
      resources:
        limits:
          # 3g, and it is `landDocument.ts`'s 25 MiB ceiling that sets it -- the two numbers
          # are one decision and were contradictory at 1g. Gmail ships an attachment
          # base64-encoded INSIDE a JSON body, so one file at the ceiling costs roughly:
          #
          #   33 MiB  base64 as it arrives      67 MiB  held as a UTF-16 JS string
          #   67 MiB  the parsed copy           25 MiB  decoded bytes, + 25 MiB to hash and put
          #   ~220 MiB peak, for ONE attachment
          #
          # Transient, not retained -- but several uncollected at once, on a baseline of
          # ~85 MiB, reaches a gigabyte. It did, three times: 2026-09-21 (whole mailbox
          # buffered, fixed by ADR 0033), then twice more after that was fixed, the last at
          # message 197 of 4,809 with one message taking 29 seconds. That last one is the
          # shape of the truth: memory spikes on a big attachment, it does not creep.
          #
          # `--smol` (deploy/Dockerfile.worker) was tried at 1g first and was not enough; it
          # stays, because collecting more often is still right for this process. Lowering
          # the 25 MiB ceiling was the alternative and was rejected: a scanned contract is
          # routinely larger than what a smaller ceiling would admit, and refusing it is
          # losing it. If that ceiling moves, this number moves with it.
          memory: 3g

  # The schema, applied before anything reads it. Same image as the control plane, which
  # carries the migrations and the `migrate` script; it runs once and exits.
  #
  # A one-shot service rather than a call at service boot: the control plane may one day run
  # more than one replica, and two replicas racing the same DDL is a failure that only shows
  # up under the load you least want it to. `migrate()` is idempotent and ledgered, so
  # re-running on every deploy costs one query.
  #
  # Without this, a deploy that adds a table leaves the services pointed at a schema that
  # does not have it. Better Auth refuses EVERY request on a schema mismatch — it is not a
  # warning — so sign-in returns 500 until the migration lands. That happened once; this
  # service is why it cannot happen again.
  db-migrate:
    # Deliberately NOT `<<: *restart`. This is meant to exit, and `restart: unless-stopped`
    # would turn a completed migration into a crash-loop.
    image: ghcr.io/muitneliss/undercroft-control-plane:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "migrate"]
    environment:
      # The one service that connects as the bootstrap superuser: it applies the schema and
      # sets the two platform roles' passwords from the variables below, so the worker and
      # the control plane can connect as themselves.
      UNDERCROFT_POSTGRES_DSN: postgres://${UNDERCROFT_PG_USER:-undercroft}:${UNDERCROFT_PG_PASSWORD:?set in .env}@undercroft-postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_APP_PG_PASSWORD: ${UNDERCROFT_APP_PG_PASSWORD:?set in .env}
      UNDERCROFT_WORKER_PG_PASSWORD: ${UNDERCROFT_WORKER_PG_PASSWORD:?set in .env}
    deploy:
      resources:
        limits:
          memory: 256m

  # The Kestra flows, delivered by the deploy. Dokploy raw compose has no checkout to mount
  # and Kestra reads flows from its own database, so `flows/` is baked into the control-plane
  # image and this one-shot pushes each file through Kestra's API -- creating or updating
  # it -- then exits. It waits for Kestra to answer (a Java standalone takes a minute) and
  # fails at once on a flow Kestra rejects. Without it, `ingest_daily` was documentation.
  kestra-flows:
    # Deliberately NOT `<<: *restart`, for the reason `db-migrate` gives.
    image: ghcr.io/muitneliss/undercroft-control-plane:${IMAGE_TAG:-latest}
    depends_on:
      kestra:
        condition: service_started
    command: ["bun", "run", "kestra:flows"]
    environment:
      UNDERCROFT_KESTRA_URL: http://undercroft-kestra:8080
      UNDERCROFT_KESTRA_USER: ${UNDERCROFT_KESTRA_USER:-admin@example.com}
      UNDERCROFT_KESTRA_PASSWORD: ${UNDERCROFT_KESTRA_PASSWORD:?set in .env}
    deploy:
      resources:
        limits:
          memory: 128m

  control-plane:
    <<: *restart
    image: ghcr.io/muitneliss/undercroft-control-plane:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      # The schema must exist before the first request, not eventually. A completed
      # dependency is a success to `--wait`; an init container with no dependent reads as a
      # service that fell over.
      db-migrate:
        condition: service_completed_successfully
    environment:
      # As its own role; see the worker's note. The internet-facing process holds the
      # privileges of `undercroft_app` and nothing more.
      UNDERCROFT_POSTGRES_DSN: postgres://undercroft_app:${UNDERCROFT_APP_PG_PASSWORD:?set in .env}@undercroft-postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_SECRET_KEY: ${UNDERCROFT_SECRET_KEY:?set in .env}
      UNDERCROFT_SESSION_SECRET: ${UNDERCROFT_SESSION_SECRET:?set in .env}
      # The assistant. All four optional, and the degradation is in two steps rather than
      # one: with no model key the interleaf says it is unavailable; with a model key but no
      # TypeSafe key it answers questions and REFUSES to offer any change, because the
      # injection gate fails closed. The boot log names which state it came up in. ADR 0029.
      UNDERCROFT_ANTHROPIC_API_KEY: ${UNDERCROFT_ANTHROPIC_API_KEY:-}
      UNDERCROFT_TYPESAFE_API_KEY: ${UNDERCROFT_TYPESAFE_API_KEY:-}
      # Signs each approval request, so "the reader said yes" cannot be a claim the browser
      # makes about itself. Unset means unsigned, which the boot log also names.
      UNDERCROFT_ASSISTANT_APPROVAL_SECRET: ${UNDERCROFT_ASSISTANT_APPROVAL_SECRET:-}
      # Defaults to claude-opus-5 in `main.ts`; set only to pin a different one.
      UNDERCROFT_ASSISTANT_MODEL: ${UNDERCROFT_ASSISTANT_MODEL:-}
      UNDERCROFT_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN:?set in .env}
      # The alias, NOT the bare service name: this service has a domain, so it is also on
      # the shared dokploy-network where `worker` is a name other projects use.
      UNDERCROFT_WORKER_URL: http://undercroft-worker:8081
      # Sign-in. All optional: with any of them unset the process starts with no way in and
      # says so once at boot, rather than offering a button that fails at the first click.
      #
      # The public URL is the one the BROWSER uses — Better Auth builds Google's
      # redirect_uri from it, so the network alias above would be a redirect_uri_mismatch.
      # It must match an Authorized redirect URI in the Google client, path included:
      # <UNDERCROFT_PUBLIC_URL>/api/auth/callback/google.
      UNDERCROFT_PUBLIC_URL: ${UNDERCROFT_PUBLIC_URL:?set in .env}
      UNDERCROFT_GOOGLE_CLIENT_ID: ${UNDERCROFT_GOOGLE_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_CLIENT_SECRET:-}
      # Per-tenant Gmail and Drive ingestion. A SECOND Google client, never the sign-in
      # one above: signing in asks for `openid email profile`, this asks for a customer's
      # mailbox. One client carrying both scope lists is one misconfiguration away from
      # handing over a mailbox as a side effect of signing in. See docs/adr/0016.
      # Unset means the consent flow does not exist and every Google source reads
      # "not connected" -- the right state while Google verification is pending.
      UNDERCROFT_GOOGLE_INGEST_CLIENT_ID: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET:-}
      # Public values, for Drive's browser Picker only: they identify the app and
      # authorise nothing. Without them the Gmail half still works and the Drive picker
      # says it is unavailable.
      UNDERCROFT_GOOGLE_PICKER_API_KEY: ${UNDERCROFT_GOOGLE_PICKER_API_KEY:-}
      UNDERCROFT_GOOGLE_PROJECT_NUMBER: ${UNDERCROFT_GOOGLE_PROJECT_NUMBER:-}
      # The Xero client, for the consent. Register <UNDERCROFT_PUBLIC_URL>/oauth/xero/callback
      # as its redirect URI. See docs/runbook/xero-setup.md.
      UNDERCROFT_XERO_CLIENT_ID: ${UNDERCROFT_XERO_CLIENT_ID:-}
      UNDERCROFT_XERO_CLIENT_SECRET: ${UNDERCROFT_XERO_CLIENT_SECRET:-}
      UNDERCROFT_EMAIL_API_KEY: ${UNDERCROFT_EMAIL_API_KEY:-}
      UNDERCROFT_EMAIL_FROM: ${UNDERCROFT_EMAIL_FROM:-}
      UNDERCROFT_EMAIL_API_URL: ${UNDERCROFT_EMAIL_API_URL:-}
      # The platform administrators: a comma-separated list of addresses that may sign in
      # with no invitation and hold admin in every tenant. Set it in Dokploy's environment,
      # by hand — `preflight` asserts the panel's config and CI never writes it.
      #
      # This variable IS the authority. There is no row anywhere saying who is one, so
      # removing an address and redeploying withdraws it at the next request, and a database
      # restore can never disagree with it. ADR 0013.
      UNDERCROFT_SUPERADMINS: ${UNDERCROFT_SUPERADMINS:-}
    networks:
      default:
        aliases:
          - undercroft-control-plane
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  minio-data:
  postgres-data:
  kestra-postgres-data:
  kestra-storage:
  kestra-workdir:
