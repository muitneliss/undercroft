# TEMPORARY -- the host builds the first-party images from `main` (ADR 0136).
#
# An OVERRIDE layered on docker-compose.server.yml, never a compose file of its own: it holds
# only what changes, and every memory limit, alias, dependency and variable stays in the base
# file, where the reasons are written. `task cd:outage-on` points the panel's command at both
# files (`-f ...server.yml -f ...server.build.yml`); `task cd:outage-off` points it back at the
# base file alone, and nothing reads this one after that.
#
# Why it exists: GitHub Actions minutes ran out until 2026-11-01, so no release can build and
# publish an image, and the base file runs only published images. Turning auto deploy on
# without this would restart the same old images on every push. So while the outage lasts, a
# push to `main` makes Dokploy clone it and build here, on the shared host -- exactly what
# the base file's difference (1) refuses in normal operation, and why this is not that file.
#
# The images get a LOCAL name, never the ghcr one. A build tagged `ghcr.io/...:latest` would
# look on this host exactly like a published release, which is the confusion `verify` exists
# to rule out; under its own name nobody can mistake it for one.
#
# `db-migrate` and `kestra-flows` run the control-plane image, so they name it and never pull
# or build it themselves: compose builds every image before it creates any container, so the
# image `control-plane` builds is already there when they start. One build, three services.
#
# UNDERCROFT_RELEASE is deliberately NOT passed: no release names this build, so the
# Dockerfiles' `""` default stands and traces carry no `service.version` rather than a guessed
# one.
#
# Delete this file in the PR that ends ADR 0136.

services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.worker
    image: undercroft-worker:main
    pull_policy: build

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.control-plane
    image: undercroft-control-plane:main
    pull_policy: build

  db-migrate:
    image: undercroft-control-plane:main
    pull_policy: never

  kestra-flows:
    image: undercroft-control-plane:main
    pull_policy: never
