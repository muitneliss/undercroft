# The platform as a SELF-INSTALL -- the file the setup wizard writes into an install folder.
#
# `packages/setup` embeds this file at build time, so the installer binary of release vX.Y.Z
# carries the compose file of vX.Y.Z, and the images it pins are that release's too
# (`IMAGE_TAG`, written by the installer, never defaulted). ADR 0095.
#
# It is `docker-compose.server.yml` with the Dokploy host taken out, and nothing else changed.
# The reasons behind every service, dependency and memory limit are written there, once;
# `packages/setup/src/composeDrift.test.ts` fails the gate when the two files stop running the
# same services from the same images. What differs, and why:
#
#   1. NO `dokploy-network`. There is no shared host network on somebody's laptop or VM, so the
#      worker has no second network and the stack reaches nothing it did not bring.
#   2. The control plane is PUBLISHED, and it is the only service that is. It binds to
#      `UNDERCROFT_BIND`, which defaults to loopback: a desktop install is reachable from this
#      machine only, and a server install sits behind the operator's own reverse proxy. MinIO,
#      Postgres and Kestra hold or reach customer data, and publish nothing.
#   3. `IMAGE_TAG` is REQUIRED. The server moves `latest`; an install is pinned to the release
#      whose installer wrote it, so a restart months later runs the same bytes.
#   4. `UNDERCROFT_DEV_SIGN_IN_AS` is passed through. A desktop install signs its one owner in
#      on loopback (ADR 0094); the control plane refuses to start with it behind any other
#      origin, so a server install cannot turn it on by accident.
#
# The `undercroft-` network aliases stay, although no neighbour here could collide with a bare
# name: they are what every reference below is written against, and keeping them makes this
# file a diff of the server's rather than a second dialect of it.
#
# Memory limits are the server's, unchanged: each is tied to a measured failure (the worker's
# 3g to the 25 MiB attachment ceiling, Kestra's 2g to a JVM that needs it). They are ceilings,
# not reservations -- the long-running services total about 8 GB, and an idle stack uses a
# fraction of it. docs/runbook/install.md tells a person how much to give Docker Desktop.

name: undercroft-install

x-restart: &restart
  restart: unless-stopped

services:
  minio:
    <<: *restart
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${UNDERCROFT_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${UNDERCROFT_S3_SECRET_KEY:?set in .env}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      default:
        aliases:
          - undercroft-minio
    deploy:
      resources:
        limits:
          memory: 1g

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://undercroft-minio:9000 $$UNDERCROFT_S3_ACCESS_KEY $$UNDERCROFT_S3_SECRET_KEY &&
      mc mb --ignore-existing local/${UNDERCROFT_S3_BUCKET_RAW:-undercroft-raw} &&
      mc anonymous set none local/${UNDERCROFT_S3_BUCKET_RAW:-undercroft-raw} &&
      echo done
      "
    environment:
      UNDERCROFT_S3_ACCESS_KEY: ${UNDERCROFT_S3_ACCESS_KEY:?set in .env}
      UNDERCROFT_S3_SECRET_KEY: ${UNDERCROFT_S3_SECRET_KEY:?set in .env}
    deploy:
      resources:
        limits:
          memory: 128m

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${UNDERCROFT_PG_USER:-undercroft}
      POSTGRES_PASSWORD: ${UNDERCROFT_PG_PASSWORD:?set in .env}
      POSTGRES_DB: ${UNDERCROFT_PG_DB:-undercroft}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UNDERCROFT_PG_USER:-undercroft}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - undercroft-postgres
    deploy:
      resources:
        limits:
          memory: 1g

  # The tenant pooler (ADR 0088). Every setting is the server's; see that file for each one.
  pgbouncer:
    <<: *restart
    image: edoburu/pgbouncer:v1.25.2-p0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: undercroft-postgres
      DB_PORT: "5432"
      DB_NAME: ${UNDERCROFT_PG_DB:-undercroft}
      DB_USER: undercroft_worker
      DB_PASSWORD: ${UNDERCROFT_WORKER_PG_PASSWORD:?set in .env}
      AUTH_TYPE: scram-sha-256
      AUTH_DBNAME: ${UNDERCROFT_PG_DB:-undercroft}
      # `$$` is a literal `$` to compose: PgBouncer binds the login's name to $1.
      AUTH_QUERY: SELECT * FROM ops.pgbouncer_auth($$1)
      LISTEN_PORT: "5432"
      POOL_MODE: session
      SERVER_RESET_QUERY: DISCARD ALL
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "8"
      MAX_USER_CONNECTIONS: "8"
      MAX_DB_CONNECTIONS: ${UNDERCROFT_PGBOUNCER_MAX_DB_CONNECTIONS:-50}
      SERVER_IDLE_TIMEOUT: "15"
      SERVER_LIFETIME: "3600"
      SERVER_LOGIN_RETRY: "2"
      QUERY_WAIT_TIMEOUT: "10"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U undercroft_worker -d ${UNDERCROFT_PG_DB:-undercroft}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - undercroft-pgbouncer
    deploy:
      resources:
        limits:
          memory: 128m

  kestra-postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${UNDERCROFT_KESTRA_PG_PASSWORD:?set in .env}
      POSTGRES_DB: kestra
    volumes: [kestra-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - undercroft-kestra-postgres
    deploy:
      resources:
        limits:
          memory: 512m

  # Kestra runs as uid 1000 and a named volume is created root-owned; without this one-shot
  # Kestra crash-loops and nothing is ever scheduled. The server file records how that was found.
  kestra-init:
    image: alpine:3.24
    command: ["sh", "-c", "chown -R 1000:1000 /app/storage /tmp/kestra-wd && echo done"]
    volumes:
      - kestra-storage:/app/storage
      - kestra-workdir:/tmp/kestra-wd
    deploy:
      resources:
        limits:
          memory: 64m

  kestra:
    <<: *restart
    image: kestra/kestra:v2.0.2
    command: server standalone
    depends_on:
      kestra-postgres:
        condition: service_healthy
      kestra-init:
        condition: service_completed_successfully
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://undercroft-kestra-postgres:5432/kestra
            username: kestra
            password: ${UNDERCROFT_KESTRA_PG_PASSWORD}
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tutorialFlows:
            enabled: false
          server:
            basic-auth:
              username: ${UNDERCROFT_KESTRA_USER:-admin@example.com}
              password: ${UNDERCROFT_KESTRA_PASSWORD}
      ENV_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN:?set in .env}
    volumes:
      - kestra-storage:/app/storage
      - kestra-workdir:/tmp/kestra-wd
    networks:
      default:
        aliases:
          - undercroft-kestra
    deploy:
      resources:
        limits:
          memory: 2g

  worker:
    <<: *restart
    image: ghcr.io/muitneliss/undercroft-worker:${IMAGE_TAG:?set in .env}
    # Above the worker's own 45s drain (ADR 0051); the server file says why the two are one.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      kestra-flows:
        condition: service_completed_successfully
    environment:
      UNDERCROFT_POSTGRES_DSN: postgres://undercroft_worker:${UNDERCROFT_WORKER_PG_PASSWORD:?set in .env}@undercroft-postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_S3_ENDPOINT: http://undercroft-minio:9000
      UNDERCROFT_S3_BUCKET_RAW: ${UNDERCROFT_S3_BUCKET_RAW:-undercroft-raw}
      UNDERCROFT_S3_ACCESS_KEY: ${UNDERCROFT_S3_ACCESS_KEY:?set in .env}
      UNDERCROFT_S3_SECRET_KEY: ${UNDERCROFT_S3_SECRET_KEY:?set in .env}
      UNDERCROFT_SECRET_KEY: ${UNDERCROFT_SECRET_KEY:?set in .env}
      UNDERCROFT_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN:?set in .env}
      UNDERCROFT_GOOGLE_INGEST_CLIENT_ID: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET:-}
      UNDERCROFT_GOOGLE_MIN_INTERVAL_MS: ${UNDERCROFT_GOOGLE_MIN_INTERVAL_MS:-}
      UNDERCROFT_XERO_CLIENT_ID: ${UNDERCROFT_XERO_CLIENT_ID:-}
      UNDERCROFT_XERO_CLIENT_SECRET: ${UNDERCROFT_XERO_CLIENT_SECRET:-}
      UNDERCROFT_TYPESAFE_API_KEY: ${UNDERCROFT_TYPESAFE_API_KEY:-}
      UNDERCROFT_TENANT_POSTGRES_URL: postgres://undercroft-pgbouncer:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_MAX_CONCURRENT_BUILDS: ${UNDERCROFT_MAX_CONCURRENT_BUILDS:-4}
      UNDERCROFT_MAX_CONCURRENT_INGESTS: ${UNDERCROFT_MAX_CONCURRENT_INGESTS:-8}
      UNDERCROFT_MAX_CONCURRENT_EXTRACTS: ${UNDERCROFT_MAX_CONCURRENT_EXTRACTS:-2}
      UNDERCROFT_MAX_CONCURRENT_SEMANTIC: ${UNDERCROFT_MAX_CONCURRENT_SEMANTIC:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: undercroft-worker
    networks:
      default:
        aliases:
          - undercroft-worker
    deploy:
      resources:
        limits:
          memory: 3g

  # The schema, applied once per start, as the bootstrap superuser. Deliberately not
  # `<<: *restart`: a one-shot that restarts is a crash-loop.
  db-migrate:
    image: ghcr.io/muitneliss/undercroft-control-plane:${IMAGE_TAG:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "migrate"]
    environment:
      UNDERCROFT_POSTGRES_DSN: postgres://${UNDERCROFT_PG_USER:-undercroft}:${UNDERCROFT_PG_PASSWORD:?set in .env}@undercroft-postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_APP_PG_PASSWORD: ${UNDERCROFT_APP_PG_PASSWORD:?set in .env}
      UNDERCROFT_WORKER_PG_PASSWORD: ${UNDERCROFT_WORKER_PG_PASSWORD:?set in .env}
    deploy:
      resources:
        limits:
          memory: 256m

  # The Kestra flows, baked into the control-plane image and pushed through Kestra's API.
  kestra-flows:
    image: ghcr.io/muitneliss/undercroft-control-plane:${IMAGE_TAG:?set in .env}
    depends_on:
      kestra:
        condition: service_started
    command: ["bun", "run", "kestra:flows"]
    environment:
      UNDERCROFT_KESTRA_URL: http://undercroft-kestra:8080
      UNDERCROFT_KESTRA_USER: ${UNDERCROFT_KESTRA_USER:-admin@example.com}
      UNDERCROFT_KESTRA_PASSWORD: ${UNDERCROFT_KESTRA_PASSWORD:?set in .env}
    deploy:
      resources:
        limits:
          memory: 128m

  control-plane:
    <<: *restart
    image: ghcr.io/muitneliss/undercroft-control-plane:${IMAGE_TAG:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      UNDERCROFT_POSTGRES_DSN: postgres://undercroft_app:${UNDERCROFT_APP_PG_PASSWORD:?set in .env}@undercroft-postgres:5432/${UNDERCROFT_PG_DB:-undercroft}
      UNDERCROFT_SECRET_KEY: ${UNDERCROFT_SECRET_KEY:?set in .env}
      UNDERCROFT_SESSION_SECRET: ${UNDERCROFT_SESSION_SECRET:?set in .env}
      UNDERCROFT_ANTHROPIC_API_KEY: ${UNDERCROFT_ANTHROPIC_API_KEY:-}
      UNDERCROFT_TYPESAFE_API_KEY: ${UNDERCROFT_TYPESAFE_API_KEY:-}
      UNDERCROFT_ASSISTANT_APPROVAL_SECRET: ${UNDERCROFT_ASSISTANT_APPROVAL_SECRET:-}
      UNDERCROFT_ASSISTANT_MODEL: ${UNDERCROFT_ASSISTANT_MODEL:-}
      UNDERCROFT_TRIGGER_TOKEN: ${UNDERCROFT_TRIGGER_TOKEN:?set in .env}
      UNDERCROFT_WORKER_URL: http://undercroft-worker:8081
      # The URL the BROWSER uses: http://127.0.0.1:<port> on a desktop install, the operator's
      # https origin on a server. Better Auth builds every redirect from it.
      UNDERCROFT_PUBLIC_URL: ${UNDERCROFT_PUBLIC_URL:?set in .env}
      UNDERCROFT_GOOGLE_CLIENT_ID: ${UNDERCROFT_GOOGLE_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_CLIENT_SECRET:-}
      UNDERCROFT_GOOGLE_INGEST_CLIENT_ID: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_ID:-}
      UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET: ${UNDERCROFT_GOOGLE_INGEST_CLIENT_SECRET:-}
      UNDERCROFT_GOOGLE_PICKER_API_KEY: ${UNDERCROFT_GOOGLE_PICKER_API_KEY:-}
      UNDERCROFT_GOOGLE_PROJECT_NUMBER: ${UNDERCROFT_GOOGLE_PROJECT_NUMBER:-}
      UNDERCROFT_XERO_CLIENT_ID: ${UNDERCROFT_XERO_CLIENT_ID:-}
      UNDERCROFT_XERO_CLIENT_SECRET: ${UNDERCROFT_XERO_CLIENT_SECRET:-}
      UNDERCROFT_EMAIL_API_KEY: ${UNDERCROFT_EMAIL_API_KEY:-}
      UNDERCROFT_EMAIL_FROM: ${UNDERCROFT_EMAIL_FROM:-}
      UNDERCROFT_EMAIL_API_URL: ${UNDERCROFT_EMAIL_API_URL:-}
      UNDERCROFT_LARK_WEBHOOK_URL: ${UNDERCROFT_LARK_WEBHOOK_URL:-}
      UNDERCROFT_LARK_WEBHOOK_SECRET: ${UNDERCROFT_LARK_WEBHOOK_SECRET:-}
      # THE AUTHORITY on who is a platform administrator (ADR 0013). A desktop install names its
      # one owner here and in the line below; a server install names the admin the wizard asked.
      UNDERCROFT_SUPERADMINS: ${UNDERCROFT_SUPERADMINS:-}
      # Loopback only -- the control plane refuses to start with it otherwise (ADR 0094).
      UNDERCROFT_DEV_SIGN_IN_AS: ${UNDERCROFT_DEV_SIGN_IN_AS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: undercroft-control-plane
    ports:
      - "${UNDERCROFT_BIND:-127.0.0.1}:${UNDERCROFT_PORT_API:-13000}:3000"
    networks:
      default:
        aliases:
          - undercroft-control-plane
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  minio-data:
  postgres-data:
  kestra-postgres-data:
  kestra-storage:
  kestra-workdir:
